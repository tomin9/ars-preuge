<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ars Preuge – pracovný priestor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="css/00-zaklad.css">
<link rel="stylesheet" href="css/10-menu-a-stranka.css">
<link rel="stylesheet" href="css/20-prvky.css">
<link rel="stylesheet" href="css/30-panely-a-okna.css">
<link rel="stylesheet" href="css/40-kalendar-a-detaily.css">
<link rel="stylesheet" href="css/50-zabezpecenie.css">
<link rel="stylesheet" href="css/60-texty-a-menu.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Navigácia"></aside>
  <div class="dscrim" id="sidescrim" hidden style="z-index:49"></div>
  <main id="main"><div class="wrap" id="view"></div></main>
</div>
<nav class="bottom" id="bottom" aria-label="Hlavná navigácia"></nav>
<div id="drawer" hidden></div>
<div id="layer"></div>
<div id="layer2"></div>
<script>
(function(){
"use strict";
//@subor js/00-nastavenia.js
//@subor js/10-pomocnici.js
//@subor js/20-data-a-vypocty.js
//@subor js/30-kostra.js
//@subor js/40-bocny-panel.js
//@subor js/50-prepojenia-a-zoznamy.js
/* ================= views ================= */
const VIEWS={};
VIEWS.prehlad=()=>{
  const me=meId(),td=today();
  const open=S.d.tasks.filter(t=>!isDone(t));
  const mine=open.filter(t=>t.assignee&&t.assignee===me).sort((a,b)=>(a.status==="tyzden"?0:1)-(b.status==="tyzden"?0:1)||byDue(a,b));
  const late=open.filter(t=>t.due&&t.due<td);
  const lc=ledgerCalc();
  const ag=agenda().filter(a=>!a.done&&a.d>=addDays(td,-30)&&a.d<=addDays(td,30)&&(a.kind!=="task"||a.d<=addDays(td,14)));
  const activeG=S.d.grants.filter(g=>["schvalene","zrealizovane"].includes(g.status));
  const unpaid=S.d.ledger.filter(x=>x.paid===false||x.state==="nevybavene");
  const feed=[];KEYS.filter(k=>k!=="comments"&&k!=="partnerships"&&k!=="zab"&&k!=="zabd").forEach(k=>S.d[k].forEach(r=>feed.push({k,r,t:r.updatedAt||r.createdAt||0})));
  S.d.comments.forEach(c=>{const[k,id]=(c.parent||"").split(":");const r=get(k,id);if(r)feed.push({k,r,t:c.at,c});});
  feed.sort((a,b)=>b.t-a.t);
  const first=S.me?(S.me.firstName||(S.me.name||"").split(" ")[0]):"";
  const dstr=new Date().toLocaleDateString("sk-SK",{weekday:"long",day:"numeric",month:"long"});
  return`<div class="head"><div><h1>${first?`Ahoj, ${esc(first)}`:"Prehľad"}</h1><p class="sub">${esc(dstr)}</p></div>
    <div class="row"><button class="btn" data-create="ledger">Zapísať platbu</button><button class="btn pri" data-create="tasks">Nová úloha</button></div></div>
  <div class="strip">
    <div><b class="${lc.bank<0?"neg":""}">${eur0(lc.bank)}</b><span>na bankovom účte</span></div>
    <div><b class="${lc.cash<0?"neg":""}">${eur0(lc.cash)}</b><span>v pokladni</span></div>
    <div><b>${me?mine.length:open.length}</b><span>${me?"mojich otvorených úloh":"otvorených úloh"}</span></div>
    <div><b class="${late.length?"neg":""}">${late.length}</b><span>úloh po termíne</span></div>
    <div><b>${S.d.grants.filter(g=>ACTIVE_G.includes(g.status)).length}</b><span>grantov v procese</span></div>
  </div>
  <div class="grid3">
    <div class="stack">
      <div class="panel"><div class="spread"><h2>${me?"Moje úlohy":"Otvorené úlohy"}</h2><button class="btn ghost sm" data-go="ulohy">Všetky úlohy</button></div>
        ${(me?mine:open.sort(byDue)).length?`<ul class="items">${(me?mine:open).slice(0,12).map(taskLi).join("")}</ul>`:`<div class="empty">${me?"Nemáte priradené žiadne otvorené úlohy.":"Žiadne otvorené úlohy."}</div>`}</div>
      <div class="panel"><div class="spread"><h2>Granty v realizácii</h2><button class="btn ghost sm" data-go="granty">Všetky granty</button></div>
        ${activeG.length?activeG.map(g=>{const c=grantCalc(g);const n=daysTo(g.settleDue);return`<div data-open="grants:${esc(g.id)}" style="cursor:pointer;padding:9px 0;border-top:1px solid var(--line)">
          <div class="spread"><b>${esc(g.name||"Grant")}</b><span class="meta">${g.settleDue?`vyúčtovanie ${n<0?`<span class="late">${fdateS(g.settleDue)}</span>`:fdateS(g.settleDue)}`:""}</span></div>
          <div class="barline" style="margin-top:6px">${bar(c.sg,c.appr,pcolor(g.projectId),c.sc)}<span class="meta">${eur0(c.sg)} z ${eur0(c.appr)}</span></div></div>`;}).join(""):`<div class="empty">Žiadny schválený grant v realizácii.</div>`}</div>
      ${unpaid.length?`<div class="panel"><div class="spread"><h2>Nevyplatené a nevybavené</h2><span class="meta">${eur(sum(unpaid,x=>x.amount))}</span></div><ul class="items">${unpaid.slice(0,8).map(ledgerLi).join("")}</ul></div>`:""}
    </div>
    <div class="stack">
      <div class="panel"><div class="spread"><h2>Termíny</h2><button class="btn ghost sm" data-go="kalendar">Kalendár</button></div>
        ${ag.length?`<ul class="items">${ag.slice(0,14).map(a=>`<li data-open="${a.open}"><i class="dot" style="background:${a.c}"></i><span class="t">${esc(a.txt)}</span><span class="meta">${a.d<td?`<span class="late">${fdateS(a.d)}</span>`:a.d===td?'<span class="late">dnes</span>':fdateS(a.d)}</span></li>`).join("")}</ul>`:`<div class="empty">Najbližší mesiac bez termínov.</div>`}</div>
      <div class="panel"><h2 style="margin-bottom:6px">Posledné zmeny v tíme</h2>
        ${feed.length?`<ul class="items feed">${feed.slice(0,10).map(f=>`<li data-open="${f.k}:${esc(f.r.id)}"><span class="t"><span class="muted small">${esc(ENT[f.k].one)}${f.c?" · komentár":""}</span> ${esc(ttl(f.k,f.r))}</span><span class="meta">${esc(personName(f.c?f.c.by:(f.r.updatedBy||f.r.createdBy))||"")} ${rel(f.t)}</span></li>`).join("")}</ul>`:`<div class="empty">Zatiaľ žiadna aktivita.</div>`}</div>
    </div>
  </div>`;
};

VIEWS.kalendar=()=>{
  const{y,m}=S.cal;const first=new Date(y,m,1),off=(first.getDay()+6)%7;const start=new Date(y,m,1-off);
  const items={};agenda().forEach(a=>{(items[a.d]=items[a.d]||[]).push(a);});
  const td=today();const cells=[];
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const s=iso(d);
    const its=(items[s]||[]);
    cells.push(`<div class="d ${d.getMonth()!==m?"o":""} ${s===td?"td":""}"><span class="dn">${d.getDate()}</span>${its.slice(0,4).map(a=>`<button class="ce ${a.done?"done":""}" style="--c:${a.c}" data-open="${a.open}" title="${esc(a.txt)}">${esc(a.txt)}</button>`).join("")}${its.length>4?`<span class="meta" style="font-size:11px">+${its.length-4} ďalšie</span>`:""}</div>`);
    if(i>=34&&d.getMonth()!==m&&(i+1)%7===0)break;
  }
  const mname=first.toLocaleDateString("sk-SK",{month:"long",year:"numeric"});
  return`<div class="head"><div><h1 style="text-transform:capitalize">${esc(mname)}</h1><p class="sub">Podujatia, termíny úloh a grantové uzávierky na jednom mieste</p></div>
    <div class="row"><button class="btn" id="cal-prev" aria-label="Predchádzajúci mesiac">‹</button><button class="btn" id="cal-now">Dnes</button><button class="btn" id="cal-next" aria-label="Nasledujúci mesiac">›</button><button class="btn pri" data-create="events">Nové podujatie</button></div></div>
  <div class="cal">${["Po","Ut","St","Št","Pi","So","Ne"].map(d=>`<div class="dh">${d}</div>`).join("")}${cells.join("")}</div>
  <div class="legend"><span><i style="background:${PINK}"></i>Podujatia</span><span><i style="background:var(--accent)"></i>Termíny úloh</span><span><i style="background:${OCHRE}"></i>Žiadosti a realizácia grantov</span><span><i style="background:${RED}"></i>Vyúčtovania</span><span><i style="background:${GREEN}"></i>Konce projektov</span></div>`;
};

VIEWS.ulohy=()=>{
  const f=S.tf,me=meId();
  let list=S.d.tasks.filter(t=>(!f.project||t.projectId===f.project)&&(!f.org||t.org===f.org)&&(!f.type||(t.types||[]).includes(f.type))
    &&(!f.who||(f.who==="__me"?t.assignee===me:f.who==="__none"?!t.assignee:t.assignee===f.who))&&(!f.q||(t.title||"").toLowerCase().includes(f.q.toLowerCase())));
  const people=[...new Set(S.d.tasks.map(t=>t.assignee).filter(Boolean))];
  const tools=`<div class="tools">
    <input type="search" id="tf-q" placeholder="Hľadať v úlohách" value="${esc(f.q)}" aria-label="Hľadať">
    <select id="tf-project" aria-label="Projekt"><option value="">Všetky projekty</option>${S.d.projects.map(p=>`<option value="${esc(p.id)}" ${f.project===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select>
    <select id="tf-who" aria-label="Zodpovedný"><option value="">Všetci</option>${me?`<option value="__me" ${f.who==="__me"?"selected":""}>Moje</option>`:""}<option value="__none" ${f.who==="__none"?"selected":""}>Nepriradené</option>${people.filter(p=>p!==me).map(p=>`<option value="${esc(p)}" ${f.who===p?"selected":""}>${esc(personName(p))}</option>`).join("")}</select>
    <select id="tf-type" aria-label="Typ"><option value="">Všetky typy</option>${ttypes().map(x=>`<option ${f.type===x?"selected":""}>${esc(x)}</option>`).join("")}</select>
    <select id="tf-org" aria-label="Organizácia"><option value="">Ars Preuge aj KaSS</option>${OPT.org.map(o=>`<option value="${o[0]}" ${f.org===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select>
    <div class="tabs"><button data-tmode="board" aria-pressed="${f.mode==="board"}">Tabuľa</button><button data-tmode="list" aria-pressed="${f.mode==="list"}">Zoznam</button></div></div>`;
  const defs={};if(f.project)defs.projectId=f.project;if(f.who==="__me"&&me)defs.assignee=me;
  let body;
  if(!S.d.tasks.length)body=`<div class="panel">${emptyBox("Zatiaľ žiadne úlohy. Zapíšte prvú – do Inboxu môžete hádzať všetko, čo treba neskôr roztriediť.","tasks","Nová úloha")}</div>`;
  else if(f.mode==="list"){
    body=`<div class="panel">${list.length?table([
      ["",t=>`<button class="check ${isDone(t)?"on":""}" data-done="${esc(t.id)}" aria-label="Hotové"></button>`],
      ["Úloha",t=>`<span class="cut">${esc(t.title||"Bez názvu")}</span>`,"t"],["Stav",t=>chip("tstat",t.status)],["Zodpovedný",t=>who(t.assignee)],
      ["Termín",t=>dueHtml(t.due,isDone(t))],["Priorita",t=>chip("prio",t.priority)],["Projekt",t=>pdot(t.projectId)],["Typ",t=>esc((t.types||[]).join(", "))]
    ],list.sort((a,b)=>(isDone(a)-isDone(b))||byDue(a,b)),t=>"tasks:"+esc(t.id)):`<div class="empty">Žiadne úlohy v tomto filtri.</div>`}</div>`;
  }else{
    body=`<div class="board">${OPT.tstat.map(([st,label,c])=>{
      let col=list.filter(t=>(t.status||"inbox")===st);
      if(st==="hotove")col.sort((a,b)=>(b.doneAt||b.updatedAt||0)-(a.doneAt||a.updatedAt||0));
      else col.sort((a,b)=>(a.priority==="urgentne"?0:1)-(b.priority==="urgentne"?0:1)||byDue(a,b));
      const total=col.length;if(st==="hotove"&&!f.allDone)col=col.slice(0,12);
      return`<div class="col" data-drop="tasks:status:${st}"><h3><span class="row" style="gap:7px;color:var(--ink);font-weight:700"><i class="dot" style="background:${c}"></i>${label}</span><span>${total}</span></h3>
        ${st==="inbox"?`<input type="text" class="qa" id="qa" placeholder="+ Rýchlo pridať a Enter" aria-label="Rýchlo pridať úlohu">`:""}
        ${col.map(taskCard).join("")}
        ${st==="hotove"&&total>12?`<button class="btn ghost sm" id="tf-alldone" style="width:100%;justify-content:center">${f.allDone?"Zobraziť menej":`Zobraziť všetkých ${total}`}</button>`:""}</div>`;
    }).join("")}</div>`;
  }
  return`<div class="head"><div><h1>Úlohy</h1><p class="sub">${S.d.tasks.filter(t=>!isDone(t)).length} otvorených · ťahaním kariet meníte stav</p></div><button class="btn pri" data-create="tasks" data-defs='${esc(JSON.stringify(defs))}'>Nová úloha</button></div>${tools}${body}`;
};
function taskCard(t){
  const p=get("projects",t.projectId),ev=get("events",t.eventId);const cl=t.checklist||[];
  return`<div class="card" draggable="true" data-drag="tasks:${esc(t.id)}" data-open="tasks:${esc(t.id)}">
    <div class="ct">${esc(t.title||"Bez názvu")}</div>
    <div class="cm">${p?`<span class="row" style="gap:5px"><i class="dot" style="background:${esc(p.color||GRAY)}"></i>${esc(p.name)}</span>`:""}
      ${ev?`<span>${esc(ev.name)}</span>`:""}${t.priority==="urgentne"&&!isDone(t)?chip("prio","urgentne"):""}
      ${(t.types||[]).map(x=>`<span class="chip out">${esc(x)}</span>`).join("")}
      ${t.assignee?who(t.assignee):""}${t.due?`<span>${dueHtml(t.due,isDone(t))}</span>`:""}
      ${cl.length?`<span>☑ ${cl.filter(x=>x.d).length}/${cl.length}</span>`:""}
      ${S.d.comments.some(c=>c.parent==="tasks:"+t.id)?`<span>💬 ${S.d.comments.filter(c=>c.parent==="tasks:"+t.id).length}</span>`:""}</div></div>`;
}
/* ----- Projekty ----- */
VIEWS.projekty=()=>{
  let list=[...S.d.projects];
  list.sort((a,b)=>(a.end||"9999").localeCompare(b.end||"9999"));
  return`<div class="head"><div><h1>Projekty</h1><p class="sub">${S.d.projects.length} projektov združenia</p></div><button class="btn pri" data-create="projects">Nový projekt</button></div>
  <div class="tools"><div class="tabs"><button data-pm="gallery" aria-pressed="${S.pm!=="table"}">Galéria</button><button data-pm="table" aria-pressed="${S.pm==="table"}">Tabuľka</button></div></div>
  ${S.pm!=="table"&&list.length?projGallery(list):`<div class="panel">${list.length?table([
    ["Projekt",p=>`<span class="row" style="gap:9px;flex-wrap:nowrap"><i class="dot" style="background:${esc(p.color||GRAY)}"></i><span class="cut">${esc(p.name||"Bez názvu")}</span></span>`,"t"],
    
    ["Granty",p=>{const g=S.d.grants.filter(x=>x.projectId===p.id);return g.length?`<span class="meta">${g.length} · ${eur0(sum(g,x=>x.approved))}</span>`:"";}],
    ["Úlohy",p=>{const c=projCalc(p);return c.T.length?`<span class="meta">${c.done}/${c.T.length}</span>`:"";}],
    ["Príjmy",p=>{const c=projCalc(p);return c.inc?`<span class="pos">${eur0(c.inc)}</span>`:"";},"num"],["Výdavky",p=>{const c=projCalc(p);return c.exp?`<span class="neg">${eur0(c.exp)}</span>`:"";},"num"]
  ],list,p=>"projects:"+esc(p.id)):emptyBox(S.d.projects.length?"V tomto filtri nie sú žiadne projekty.":"Zatiaľ tu nie je žiadny projekt. Projekt spája granty, podujatia, úlohy, platby a ľudí.",S.d.projects.length?null:"projects","Nový projekt")}</div>`}`;
};
VIEWS.projekt=()=>{
  const p=get("projects",S.id);if(!p)return`<div class="empty">Projekt sa nenašiel.<br><button class="btn" data-go="projekty">Späť na projekty</button></div>`;
  const c=projCalc(p),pid=esc(p.id),col=p.color||GRAY;
  const G=related("projects",p,"grants"),E=related("projects",p,"events").sort((a,b)=>(b.date||"").localeCompare(a.date||"")),C=related("projects",p,"contacts").sort((a,b)=>(a.name||"").localeCompare(b.name||"","sk"));
  const tab=S.ptab||"podujatia";
  const TABS=[["podujatia","Podujatia",E.length,["events","Nové podujatie"]],["ulohy","Úlohy",c.open,["tasks","Nová úloha"]],["granty","Granty",G.length,["grants","Nový grant"]],["financie","Financie",c.L.length,["ledger","Zapísať platbu"]],["ludia","Ľudia",C.length,["contacts","Nový kontakt"]]];
  const cur=TABS.find(t=>t[0]===tab)||TABS[0];
  const head=coverUrl(p)?`<div class="pcw"><img class="pcover" src="${esc(coverUrl(p))}" alt="" style="object-position:${esc(posOf(p))}"><button class="btn pcedit" data-peek="projects:${pid}">Upraviť</button></div><h1 class="ptitle">${esc(p.name||"Bez názvu")}</h1>`
    :`<div class="spread ptitle" style="align-items:center;flex-wrap:nowrap"><h1>${esc(p.name||"Bez názvu")}</h1><button class="btn" style="flex:none" data-peek="projects:${pid}">Upraviť</button></div>`;
  const bar_=`<div class="ptabs" role="tablist">${TABS.map(([k,l,n])=>`<button role="tab" data-ptab="${k}" aria-selected="${cur[0]===k}">${l}${n?`<span>${n}</span>`:""}</button>`).join("")}${cur[3]?`<span class="ptabs-r"><button class="btn pri sm" data-linknew="projects:${pid}|${cur[3][0]}">${cur[3][1]}</button></span>`:""}</div>`;
  let body="";
  if(cur[0]==="obsah"){
    const row=(l,v)=>`<div class="pl">${l}</div><div class="pv2">${v||'<span class="muted">—</span>'}</div>`;
    body=`<div class="pprops">${row("Miesto",esc(p.place||""))}
      
      ${row("Príjmy / výdavky",c.L.length?`<span class="pos">${eur(c.inc)}</span> / <span class="neg">${eur(c.exp)}</span>`:"")}</div>
      ${p.desc?`<p class="desc" style="margin-top:22px">${esc(p.desc)}</p>`:`<p class="muted" style="margin-top:22px">Popis projektu doplníte cez Upraviť.</p>`}`;
  }
  if(cur[0]==="podujatia"){
    body=`<div class="gal">${E.map(e=>{const u=coverUrl(e);return`<div class="gcard" data-open="events:${esc(e.id)}" tabindex="0" role="link"><div class="gimg" style="background:linear-gradient(160deg,${esc(col)},${esc(col)}cc)">${u?`<img src="${esc(u)}" alt="" loading="lazy" style="object-position:${esc(posOf(e))}">`:""}</div>
      <div class="gbody"><b>${esc(e.name||"Podujatie")}</b>${e.date?`<div class="gl">${fdate(e.date)}${e.time?" "+esc(e.time):""}${e.dateTo&&e.dateTo!==e.date?" → "+fdate(e.dateTo):""}</div>`:""}${e.place?`<div class="gl">${esc(e.place)}</div>`:""}</div></div>`;}).join("")}
      <button class="gnew" data-linknew="projects:${pid}|events">+ Nové podujatie</button></div>${linkSel("projects",p,"events")}`;
  }
  if(cur[0]==="ulohy"){
    body=`<div class="board">${OPT.tstat.map(([st,label,cc])=>{let L=c.T.filter(t=>(t.status||"inbox")===st);const n=L.length;
      L.sort((a,b)=>st==="hotove"?(b.doneAt||b.updatedAt||0)-(a.doneAt||a.updatedAt||0):(a.priority==="urgentne"?0:1)-(b.priority==="urgentne"?0:1)||byDue(a,b));if(st==="hotove")L=L.slice(0,8);
      return`<div class="col" data-drop="tasks:status:${st}"><h3><span class="row" style="gap:7px;color:var(--ink);font-weight:700"><i class="dot" style="background:${cc}"></i>${label}</span><span>${n}</span></h3>${L.map(taskCard).join("")}</div>`;}).join("")}</div>${linkSel("projects",p,"tasks")}`;
  }
  if(cur[0]==="granty"){
    body=`<div class="gal">${G.map(grantCard).join("")}
      <button class="gnew" data-linknew="projects:${pid}|grants">+ Nový grant</button></div>${linkSel("projects",p,"grants")}`;
  }
  if(cur[0]==="financie"){
    const pf=S.pf2=S.pf2||{},yrs=[...new Set(c.L.map(x=>(x.date||"").slice(0,4)).filter(Boolean))].sort();
    const nPl=c.L.filter(x=>!x.date).length,opts=[...yrs,...(nPl?["plan"]:[])];
    if(pf.pid!==p.id){pf.pid=p.id;pf.year=yrs.length?yrs[yrs.length-1]:(nPl?"plan":"");pf.tab="dennik";}
    if(pf.year&&!opts.includes(pf.year))pf.year=opts[opts.length-1]||"";
    const Y=pf.year,YL=c.L.filter(x=>inYear(x,Y)),inc=sum(YL.filter(x=>x.type==="prijem"),x=>x.amount),exp=sum(YL.filter(x=>x.type!=="prijem"),x=>x.amount);
    const yl=Y==="plan"?"plánované":Y||"spolu";
    const ytabs=opts.length?`<div class="ptabs" role="tablist">${yrs.map(y=>`<button role="tab" data-pfyear="${y}" aria-selected="${Y===y}">${y}</button>`).join("")}${nPl?`<button role="tab" data-pfyear="plan" aria-selected="${Y==="plan"}">Plánované</button>`:""}</div>`:"";
    const hasCat=c.L.some(x=>x.category);
    const mtabs=`<div class="tools"><div class="tabs">${[["dennik","Denník"],["kategorie","Kategórie"],["partneri","Podľa partnerov"]].map(([k,l])=>`<button data-pftab="${k}" aria-pressed="${pf.tab===k}">${l}</button>`).join("")}</div></div>`;

        ["Grant",x=>`<span class="meta">${gName(get("grants",x.grantId))}</span>`],["Doklad",x=>`<span class="meta">${esc(x.docNo||"")}</span>`],["Suma",x=>`<span class="${x.type==="prijem"?"pos":"neg"}">${x.type==="prijem"?"+":"−"}${eur(x.amount)}</span>`,"num"]],L,x=>"ledger:"+esc(x.id))

  }
  if(cur[0]==="ludia"){

      ${x.position||x.org?`<div class="gl">${esc([x.position,x.org].filter(Boolean).join(", "))}</div>`:""}${x.email?`<div class="gl"><a href="mailto:${esc(x.email)}">${esc(x.email)}</a></div>`:""}${x.phone?`<div class="gl">${esc(x.phone)}</div>`:""}</div></div>`).join("")}
      <button class="gnew" data-linknew="projects:${pid}|contacts">+ Nový kontakt</button></div>${linkSel("projects",p,"contacts")}`;

  return`${head}${bar_}${body}`;
};
function linkSel(e,r,t){
  const ids=new Set(related(e,r,t).map(x=>x.id));

  return avail.length?`<select class="linksel" data-linkadd="${e}:${esc(r.id)}|${t}" aria-label="Prepojiť existujúce"><option value="">↗ Prepojiť existujúce…</option>${avail.map(x=>`<option value="${esc(x.id)}">${esc(ttl(t,x))}${t==="grants"&&provName(x)?" — "+esc(provName(x)):""}</option>`).join("")}</select>`:"";

const GCOLS=[["Príprava",["napad","priprava","pozastavene"]],["Podané",["podane"]],["Schválené",["schvalene"]],["Zrealizované",["zrealizovane"]],["Uzavreté",["vyuctovane","nepodporene"]]];
function nextGrantDate(g){
  const c=[["Uzávierka",g.submitTo,["napad","priprava"]],["Koniec realizácie",g.realTo,["schvalene"]],["Vyúčtovanie",g.settleDue,["schvalene","zrealizovane"]]];
  for(const[l,d,st]of c)if(d&&st.includes(g.status))return[l,d];return null;
}

function callImport(id){
  const g=get("grants",id);if(!g)return;const L=$("#layer2");
  L.innerHTML=`<div class="scrim"><div class="modal" role="dialog" aria-modal="true" style="max-width:640px;width:92vw"><h3 style="margin:0 0 6px">Doplniť údaje o výzve</h3><p class="small" style="margin:0 0 8px">Pošlite Claude odkaz na výzvu alebo jej text a vložte sem údaje, ktoré vám vráti. Vyplnia sa len polia, ktoré sú v texte uvedené.</p><textarea id="ci-t" spellcheck="false" placeholder="${esc(CALLEX)}" style="width:100%;min-height:240px;font-family:ui-monospace,Menlo,monospace;font-size:13px"></textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" data-a="0">Zrušiť</button><button class="btn pri" data-a="1">Doplniť</button></div></div></div>`;
  const done=()=>{L.innerHTML="";};const t=$("#ci-t");t.focus();
  L.querySelector('[data-a="0"]').onclick=done;
  L.querySelector('[data-a="1"]').onclick=()=>{
    let o;try{o=JSON.parse(t.value.trim().replace(/^```(?:json)?\s*|\s*```$/g,""));}catch(_){toast("Text nie je platný — vložte údaje v tvare, aký vidíte v ukážke.");return;}
    if(!o||typeof o!=="object"||Array.isArray(o)){toast("Text nie je platný.");return;}
    const patch={};Object.keys(CALLF).forEach(k=>{let v=o[k];if(v===undefined||v===null||v==="")return;
      if(CALLF[k]==="n"){v=+String(v).replace(/\s/g,"").replace(",",".");if(!isFinite(v))return;}
      else if(CALLF[k]==="d"){v=String(v).trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return;}
      else v=String(v);
      patch[k]=v;});
    if(!Object.keys(patch).length){toast("V texte som nenašiel žiadne známe polia.");return;}
    done();upd("grants",id,patch);toast("Doplnených polí: "+Object.keys(patch).length+".");};
}

function renderPdfThumbs(root){
  root.querySelectorAll("canvas[data-pdfthumb]").forEach(async cv=>{
    const href=cv.dataset.pdfthumb;cv.removeAttribute("data-pdfthumb");
    try{const lib=await loadPdfJs();const buf=await (await fetch(href)).arrayBuffer();const pdf=await lib.getDocument({data:buf}).promise;const pg=await pdf.getPage(1);
      const v0=pg.getViewport({scale:1}),sc=220/v0.width,vp=pg.getViewport({scale:sc});cv.width=vp.width;cv.height=vp.height;
      await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;cv.hidden=false;const f=cv.parentNode.querySelector(".dfi");if(f)f.remove();}catch(_){}
  });
}

<h2>II.<br>Predmet zmluvy</h2><p>Predmetom tejto zmluvy je záväzok autora vytvoriť a objednávateľovi odovzdať: ${subj}, a to v termíne ${when} (ďalej len „dielo“).</p>

<h2>IV.<br>Práva a povinnosti zmluvných strán</h2><ol><li>Autor je povinný dielo odovzdať riadne a v termíne určenom dodatočne objednávateľom v zodpovedajúcej umeleckej a odbornej kvalite, bez akýchkoľvek faktických alebo právnych vád, a ku ktorému nadobúda dňom jeho odovzdania vlastnícke právo.</li><li>Autor sa touto zmluvou zaväzuje pri tvorbe diela postupovať odborne a podľa pokynov objednávateľa, a zapracovať prípadné pripomienky k dielu bez zbytočného odkladu, najneskôr do 5 pracovných dní odo dňa doručenia objednávateľových pripomienok.</li><li>Autor zodpovedá za pôvodnosť diela a za prípadné, i keď neúmyselné porušenie cudzích autorských práv, a v nadväznosti na to za prípadnú škodu, ktorá objednávateľovi v tejto súvislosti vznikne.</li><li>Autor týmto potvrdzuje, že je jediným tvorcom tohto diela, na diele neviaznu žiadne práva tretích osôb a nie je zaťažené ani inými ťarchami.</li><li>Autor týmto vyhlasuje, že dielo neobsahuje skutočnosti, ktoré by mohli bez právneho dôvodu zasiahnuť do práv alebo právom chránených záujmov tretích osôb, alebo ktoré by mohli byť v rozpore s dobrými mravmi, prípadne všeobecne záväznými právnymi predpismi.</li><li>Autor sa zaväzuje zachovávať mlčanlivosť o všetkých skutočnostiach, ktoré sa dozvedel pri vykonávaní svojej činnosti pre objednávateľa v súvislosti s plnením tejto zmluvy.</li><li>Objednávateľ je povinný poskytnúť autorovi bezodkladnú súčinnosť, po predložení jeho žiadosti.</li><li>Objednávateľ sa zaväzuje najneskôr do 5 pracovných dní odo dňa odovzdania diela zaslať autorovi svoje pripomienky, inak sa predpokladá, že dielo prijíma bez výhrady.</li><li>Objednávateľ má právo vykonať korektúru diela, prípadne vykonať inú technickú úpravu diela, a to podľa vlastnej potreby odôvodnenej naplnením účelu tejto zmluvy.</li></ol>
<h2>V.<br>Autorské práva</h2><ol><li>Autor týmto udeľuje objednávateľovi súhlas na použitie diela ako celku, prípadne jeho jednotlivých častí v zmysle § 19 ods. 4 Autorského zákona v časovo, územne a vecne neobmedzenom rozsahu, pričom zahŕňa aj právo na úpravu, prepracovanie a vykonanie zmien diela; ide o výhradnú licenciu s možnosťou poskytnutia sublicencie tretím osobám a autor nevyžaduje, aby ho o tom objednávateľ informoval.</li><li>Autor je povinný zdržať sa použitia diela, prípadne udeliť súhlas na použitie diela tretím osobám.</li><li>V prípade, ak na vytvorenie diela autor použije iné diela autorsky chránené v prospech iných autorov, je autor povinný zabezpečiť súhlasy týchto autorov a vysporiadať všetky ich autorskoprávne nároky; to neplatí v prípade, ak ide o použitie diel poskytnutých autorovi zo strany objednávateľa.</li><li>V prípade, ak by sa tretie osoby prihlásili so svojimi autorskými nárokmi, autor sa zaväzuje na svoje náklady a riziko urobiť všetky právne kroky na zabezpečenie ochrany objednávateľa a zaväzuje sa uhradiť všetky náklady, ktoré objednávateľovi vzniknú, v súvislosti s ochranou svojich práv a prípadným zaviazaním k úhrade škody tretím osobám v súvislosti so súdnym konaním o porušení autorského práva.</li><li>Zmluvné strany s cieľom vyhnúť sa akýmkoľvek pochybnostiam zhodne potvrdzujú, že zo zmluvy nevyplýva povinnosť objednávateľa dielo použiť.</li></ol>
<h2>VI.<br>Zodpovednosť za vady</h2><ol><li>Autor zodpovedá za vady, ktoré má dielo pri prevzatí objednávateľom.</li><li>Autor je povinný na svoje náklady vadu odstrániť, a to najneskôr do 5 pracovných dní odo dňa oznámenia vady; zmluvné strany sa môžu dohodnúť na inej primeranej lehote.</li></ol>
<h2>VII.<br>Odstúpenie od zmluvy a zmluvná pokuta</h2><ol><li>Objednávateľ má právo odstúpiť od zmluvy v prípade, ak má dielo nedostatky, ktoré bránia tomu, aby sa mohlo použiť na účel dohodnutý v zmluve a v prípade, ak autor neodstráni uvedené nedostatky v stanovenej lehote, ktorú mu objednávateľ poskytne.</li><li>Objednávateľ je tiež oprávnený od zmluvy odstúpiť v prípade, ak autor nevytvorí dielo v dohodnutom čase a v súlade s pokynmi objednávateľa.</li><li>V prípadoch uvedených v ods. 1 a ods. 2 tohto článku nepatrí autorovi odmena ani náhrada vynaložených nákladov.</li><li>Autor je oprávnený od zmluvy odstúpiť v prípade, ak mu objednávateľ neposkytne potrebnú súčinnosť, a to ani po opakovanom upozornení. V takomto prípade má autor nárok na úhradu nákladov vynaložených v súvislosti s vytvorením diela, ktoré je povinný riadne preukázať v lehote 15 dní odo dňa odstúpenia od zmluvy.</li><li>Zmluvná strana je oprávnená odstúpiť od tejto zmluvy, ak druhá zmluvná strana poruší povinnosti vyplývajúce z tejto zmluvy podstatným spôsobom a napriek písomnej výzve druhej zmluvnej strany nevykoná nápravu v primeranej lehote, ktorá nesmie byť kratšia ako 15 dní.</li><li>Odstúpenie od zmluvy je účinné dňom doručenia druhej zmluvnej strane.</li><li>V prípade, ak autor neodovzdá dielo riadne a včas z dôvodov zapríčinených na strane autora, je povinný uhradiť objednávateľovi zmluvnú pokutu vo výške 30 % z odmeny vyčíslenej v čl. III ods. 1 tejto zmluvy. Zaplatením zmluvnej pokuty nie je dotknuté právo objednávateľa obrátiť sa so svojimi nárokmi na príslušný všeobecný súd.</li></ol>
<h2>VIII.<br>Záverečné ustanovenia</h2><ol><li>Zmluva sa uzatvára na dobu určitú, do odovzdania diela riadne a včas, bez vád, v súlade s touto zmluvou, respektíve do splnenia povinností zmluvných strán.</li><li>Ukončenie zmluvy, odovzdanie diela alebo akékoľvek iné ukončenie zmluvy nemá vplyv na trvanie využitie diela v zmysle čl. V tejto zmluvy.</li><li>Akékoľvek zmeny a dodatky k tejto zmluve môžu byť vykonané výlučne písomnou formou a so súhlasom obidvoch zmluvných strán.</li><li>Zmluvné strany sa ďalej dohodli, že všetky spory, tejto zmluvy sa týkajúce alebo z nej vyplývajúce, budú riešiť prednostne vzájomným rokovaním a dohodou zmluvných strán.</li><li>Táto zmluva sa vyhotovuje v dvoch rovnopisoch v slovenskom jazyku, po jednom vyhotovení pre každú zmluvnú stranu.</li><li>Zmluvné strany vzájomne vyhlasujú, že si zmluvu riadne prečítali, jej obsahu porozumeli a svojim vlastnoručným podpisom potvrdzujú, že súhlasia s obsahom zmluvy, ktorá ako celok vyjadruje ich skutočnú, vážnu a slobodnú vôľu, a že túto neuzatvorili v tiesni, pod nátlakom, uvedením do omylu, prípadne za nápadne nevýhodných podmienok.</li></ol>${ctSign(o,"autor")}`;
  }
  return`<!doctype html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>Zmluva o dielo</title><style>${ctCss()}@page{size:A4;margin:2.2cm}</style></head><body>${b}</body></html>`;
}

async function mergeContacts(keepId,dupId){
  const keep=get("contacts",keepId),dup=get("contacts",dupId);if(!keep||!dup||keepId===dupId)return false;
  const patch={};
  ENT.contacts.fields.forEach(f=>{const k=f.k;if(k==="name"||f.t==="image"||f.t==="tags")return;const a=keep[k],b=dup[k];
    if(f.t==="mrel"){const u=[...new Set([...(a||[]),...(b||[])])];if(u.length!==(a||[]).length)patch[k]=u;}
    else if(f.t==="long"){if(b&&b!==a)patch[k]=a?a+"\n\n"+b:b;}
    else if((a==null||a==="")&&b!=null&&b!=="")patch[k]=b;});
  if(dup.icon&&!keep.icon)patch.icon=dup.icon;
  if(dup.orgFn||keep.orgFn)patch.orgFn=Object.assign({},dup.orgFn||{},keep.orgFn||{});
  {const u=[...new Set([...tagList(keep),...tagList(dup)])];if(u.length&&u.length!==tagList(keep).length)patch.tags=u;}
  if((dup.docs||[]).length)patch.docs=[...(keep.docs||[]),...dup.docs];
  if(patch.orgIds||(keep.orgIds||[]).includes(dupId))patch.orgIds=(patch.orgIds||keep.orgIds||[]).filter(x=>x!==keepId&&x!==dupId);
  if(Object.keys(patch).length)await upd("contacts",keepId,patch);
  for(const e of Object.keys(ENT)){
    if(!Array.isArray(S.d[e]))continue;const fs=(ENT[e].fields||[]).filter(f=>f.e==="contacts");if(!fs.length)continue;
    for(const r of [...S.d[e]]){if(e==="contacts"&&r.id===dupId)continue;const pp={};
      fs.forEach(f=>{if(f.t==="rel"&&r[f.k]===dupId)pp[f.k]=keepId;
        else if(f.t==="mrel"&&(r[f.k]||[]).includes(dupId))pp[f.k]=[...new Set(r[f.k].map(x=>x===dupId?keepId:x))].filter(x=>!(e==="contacts"&&f.k==="orgIds"&&x===r.id));});
      if(Object.keys(pp).length)await upd(e,r.id,pp);}
  }
  for(const c of S.d.contacts.filter(x=>x.id!==dupId&&x.id!==keepId&&x.orgFn&&x.orgFn[dupId])){const m=Object.assign({},c.orgFn);if(!m[keepId])m[keepId]=m[dupId];delete m[dupId];await upd("contacts",c.id,{orgFn:m});}
  for(const pt of S.d.partnerships.filter(x=>x.contactId===dupId)){
    if(S.d.partnerships.some(x=>x.contactId===keepId&&x.eventId===pt.eventId))await del("partnerships",pt.id);else await upd("partnerships",pt.id,{contactId:keepId});}
  for(const c of S.d.comments.filter(x=>x.parent==="contacts:"+dupId))await upd("comments",c.id,{parent:"contacts:"+keepId});
  for(const z of S.d.zab.filter(x=>(x.personal||[]).some(r=>r.contactId===dupId)))
    await zbSave(z.id,y=>({personal:(y.personal||[]).map(r=>r.contactId===dupId?Object.assign({},r,{contactId:keepId}):r)}));
  for(const z of (S.d.zabd||[]).filter(x=>x.contactId===dupId))await upd("zabd",z.id,{contactId:keepId});
  return del("contacts",dupId);
}

function phOpen(url,i){

  const host=document.createElement("div");host.className="phlb";host.setAttribute("role","dialog");host.setAttribute("aria-label","Fotka");
  host.innerHTML=`<button class="phx" data-lbclose aria-label="Zavrieť">×</button><button class="phn prev" data-lbprev aria-label="Predošlá">‹</button><img alt="" referrerpolicy="no-referrer"><button class="phn next" data-lbnext aria-label="Ďalšia">›</button><div class="phc"></div>`;

}

/* ================= search palette ================= */
function openSearch(){
  const L=$("#layer");L.innerHTML=`<div class="scrim" id="pal-scrim"><div class="modal pal" role="dialog" aria-modal="true" aria-label="Hľadať"><input type="search" id="pal-q" placeholder="Hľadať úlohy, projekty, granty, podujatia, kontakty, platby…" autocomplete="off"><div class="res" id="pal-res"></div></div></div>`;
  const inp=$("#pal-q"),res=$("#pal-res");let hits=[],hl=0;
  const drawRes=()=>{const q=inp.value.trim().toLowerCase();hits=[];
    if(q){for(const k of ["projects","grants","events","tasks","contacts","ledger","lines"]){S.d[k].forEach(r=>{const t=ttl(k,r);const hay=(t+" "+(r.org||"")+" "+(k==="grants"?provName(r):"")+" "+(r.docNo||"")+" "+(r.email||"")).toLowerCase();if(hay.includes(q))hits.push({k,r,t,i:t.toLowerCase().indexOf(q)});});}
      hits.sort((a,b)=>(a.i<0?99:a.i)-(b.i<0?99:b.i));hits=hits.slice(0,30);}
    else hits=[...KEYS.filter(k=>k!=="comments"&&k!=="partnerships"&&k!=="zab"&&k!=="zabd").flatMap(k=>S.d[k].map(r=>({k,r,t:ttl(k,r),u:r.updatedAt||0})))].sort((a,b)=>b.u-a.u).slice(0,8);
    hl=Math.min(hl,Math.max(hits.length-1,0));
    res.innerHTML=hits.length?(q?"":'<div class="meta" style="padding:6px 12px">Naposledy upravené</div>')+hits.map((h,i)=>`<button class="${i===hl?"hl":""}" data-i="${i}">${h.k==="projects"?`<i class="dot" style="background:${esc(h.r.color||GRAY)}"></i>`:""}<span>${esc(h.t)}</span><span class="k">${esc(ENT[h.k].one)}</span></button>`).join(""):`<div class="empty" style="padding:12px 14px">Nič sa nenašlo.</div>`;
    res.querySelectorAll("button").forEach(b=>b.onclick=()=>pick(+b.dataset.i));};
  const pick=i=>{const h=hits[i];if(!h)return;L.innerHTML="";openRec(h.k,h.r.id);};
  inp.oninput=()=>{hl=0;drawRes();};
  inp.onkeydown=e=>{if(e.key==="ArrowDown"){e.preventDefault();hl=Math.min(hl+1,hits.length-1);drawRes();}else if(e.key==="ArrowUp"){e.preventDefault();hl=Math.max(hl-1,0);drawRes();}else if(e.key==="Enter"){e.preventDefault();pick(hl);}};
  $("#pal-scrim").addEventListener("mousedown",e=>{if(e.target.id==="pal-scrim")L.innerHTML="";});
  drawRes();inp.focus();
}

async function exportCsv(kind,id){
  if(!dl)return;const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;const n=v=>(Math.round((+v||0)*100)/100).toFixed(2).replace(".",",");
  const lc=ledgerCalc();let rows,name;
  if(kind==="grant"){
    const g=get("grants",id);if(!g)return;const c=grantCalc(g);
    rows=[[ORG.name+", IČO "+ORG.ico],["Podklad k vyúčtovaniu: "+(g.name||"")],["Poskytovateľ: "+provName(g)+(g.contractNo?", zmluva č. "+g.contractNo:"")],["Schválená suma: "+n(g.approved)+" €"],[],
      ["Rozpočtová položka","P. č.","Dátum","Doklad č.","Popis","Dodávateľ","Z dotácie","Spolufinancovanie","Vyplatené"]];
    const Ln=S.d.lines.filter(l=>l.grantId===g.id);
    const groups=[...Ln.map(l=>({name:l.name||"Položka",L:c.L.filter(x=>x.lineId===l.id&&x.type!=="prijem"),l})),{name:"Bez priradenej položky",L:c.L.filter(x=>!x.lineId&&x.type!=="prijem")}];
    groups.forEach(gr=>{if(!gr.L.length&&!gr.l)return;gr.L.sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(x=>rows.push([gr.name,(lc.map[x.id]||{}).seq,fdate(x.date),x.docNo,x.desc,ttl("contacts",get("contacts",x.contactId)),cofinG(x)?"":n(x.amount),cofinG(x)?n(x.amount):"",x.paid===false?"nie":"áno"]));
      rows.push([gr.name+" – spolu","","","","","",n(sum(gr.L.filter(x=>!cofinG(x)),x=>x.amount)),n(sum(gr.L.filter(x=>cofinG(x)),x=>x.amount)),gr.l&&gr.l.fromGrant?"rozpočet z dotácie "+n(gr.l.fromGrant):""]);});
    rows.push([],["SPOLU","","","","","",n(c.sg),n(c.sc),""]);
    name=`vyuctovanie-${(g.name||"grant").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").slice(0,40)}.csv`;
  }else{
    const list=[...ledgerFiltered()].sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.createdAt||0)-(b.createdAt||0));
    rows=[["P. č.","Dátum","Typ","Účet","Popis","Komu / od koho","Doklad č.","Projekt","Grant","Rozpočtová položka","Kategória","Príjem","Výdavok","Zost. banka","Zost. pokladňa","Vyplatené","Spolufinancovanie"]];
    list.forEach(x=>{const m=lc.map[x.id]||{};rows.push([m.seq,fdate(x.date),optL("ltype",x.type),optL("acct",x.account||"banka"),x.desc,ttl("contacts",get("contacts",x.contactId)),x.docNo,ttl("projects",get("projects",x.projectId)),ttl("grants",get("grants",x.grantId)),ttl("lines",get("lines",x.lineId)),x.category,x.type==="prijem"?n(x.amount):"",x.type!=="prijem"?n(x.amount):"",n(m.bank),n(m.cash),x.paid===false?"nie":"áno",ttl("grants",get("grants",cofinG(x)))]);});
    name=`penazny-dennik-${S.ff.year||"vsetko"}-${today()}.csv`;
  }
  const csv="\ufeff"+rows.map(r=>r.map(q).join(";")).join("\r\n");
  try{await dl.save({filename:name,data:csv});}catch(e){if(e&&e.code!=="declined")toast("Export sa nepodaril.");}
}

/* one-time cleanup: watts and lengths used to have their own fields – move them into the item name */
/* items entered at a work with a Zdroj become deliveries automatically, so they show like deliveries entered in the summary.
   Same supplier + same item = one delivery; its id is derived from the names so two people syncing at once write the same record. */
function zbSupId(kto,naz){let h=2166136261;const t=zbKey(kto)+"|"+zbKey(naz);for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619);}return"a_"+(h>>>0).toString(36)+"_"+t.length;}
const ZB_TYP=[["","druh…"],["pozicane","požičané"],["darovane","darované"],["kupene","kúpené"],["objednane","objednané"]];
/* kind of a row; older rows had it written in the Zdroj field ("kúpené", "požičať z …") or none at all */
const zbTypGuess=r=>{const z=String(r.zdroj||"");if(/k[uú]p/i.test(z))return"kupene";if(/objedn/i.test(z))return"objednane";if(/po[zž]i[cč]/i.test(z)||/daro/i.test(z))return/daro/i.test(z)?"darovane":"pozicane";if(r.supplyId||zbKey(z))return"pozicane";return"";};
const zbTyp=r=>r.typ!==undefined?r.typ:zbTypGuess(r);
const zbLent=r=>{const t=zbTyp(r);return t==="pozicane"||t==="darovane";};
function zbSyncSupplies(){
  if(S.readOnly||S.loading||!db||S.zb.syncing)return;
  const byId=new Map(S.d.zabd.map(d=>[d.id,d])),byKey=new Map();
  S.d.zabd.forEach(d=>{const k=zbKey(d.kto)+"|"+zbKey(d.nazov);if(!byKey.has(k))byKey.set(k,d);});
  const want=r=>!!(r.nazov&&zbKey(r.zdroj)&&zbLent(r));
  const match=r=>{if(!want(r))return null;const d=r.supplyId&&byId.get(r.supplyId);
    if(d&&zbKey(d.kto)===zbKey(r.zdroj)&&zbKey(d.nazov)===zbKey(r.nazov))return null;   // correctly linked
    const k=zbKey(r.zdroj)+"|"+zbKey(r.nazov),ex=byKey.get(k);return{k,id:ex?ex.id:zbSupId(r.zdroj,r.nazov),ex};};
  const plan={},works=new Set(),used=new Set();
  S.d.zab.forEach(x=>(x.technika||[]).forEach(r=>{
    if(r.typ===undefined)works.add(x.id);                                   // store the kind once
    const m=match(r);
    if(m){works.add(x.id);used.add(m.id);const p=plan[m.id]||(plan[m.id]={m,kto:String(r.zdroj).trim(),nazov:String(r.nazov).trim(),ks:0,ok:true,typ:zbTyp(r)});p.ks+=zbNum(r.ks||1);if(!r.ok)p.ok=false;}
    else if(r.supplyId&&(!want(r)||!byId.has(r.supplyId)))works.add(x.id); // unlink
    else if(r.supplyId)used.add(r.supplyId);}));
  const orphans=S.d.zabd.filter(d=>String(d.id).startsWith("a_")&&!used.has(d.id));
  if(!works.size&&!orphans.length)return;
  S.zb.syncing=true;
  (async()=>{try{
    for(const id in plan){const p=plan[id];
      if(p.m.ex){const u=S.d.zab.reduce((t,x)=>t+(x.technika||[]).filter(r=>r.supplyId===id&&want(r)).reduce((v,r)=>v+zbNum(r.ks||1),0),0)+p.ks;
        if(u>zbNum(p.m.ex.ks))await upd("zabd",id,{ks:String(u)});}
      else await write(async()=>{const t=Date.now();await db.collection(ENT.zabd.col).doc(id).set(Object.assign({kto:p.kto,nazov:p.nazov,ks:String(p.ks),typ:p.typ,ok:p.ok,createdAt:t,updatedAt:t},meId()?{createdBy:meId(),updatedBy:meId()}:{}));});
    }
    for(const wid of works)await zbSave(wid,y=>{let ch=false;const a=(y.technika||[]).map(r=>{let c=r;

/* older people rows had a typed role and name – turn them into a contact role and, where the name exists in Contacts, a contact link */
function zbMigratePeople(){
  if(S.readOnly||S.loading||!db||S.zb.migP)return;
  const byName=new Map();S.d.contacts.forEach(c=>{const k=zbKey(c.name);if(k&&!byName.has(k))byName.set(k,c);});
  const fix=r=>{let c=null;
    if(r.rola&&!zbIsRole(r.rola)){const old=String(r.rola).trim(),ko=zbKey(old),role=/dobrovol/.test(ko)?"dobrovolnik":/^(clen )?timu?$/.test(ko)?"tim":"";c=Object.assign({},r,{rola:role});
      if(!(role&&/^(dobrovolnik|clen timu|tim)$/.test(ko)))c.kedy=r.kedy?`${old} · ${r.kedy}`:old;}
    const b=c||r;
    if(!b.contactId&&b.kto){const k=zbKey(b.kto);
      if(/^dobrovolnik$/.test(k)){c=Object.assign({},b,{kto:""});if(!c.rola)c.rola="dobrovolnik";}
      else{const ct=byName.get(k);if(ct){c=Object.assign({},b,{contactId:ct.id,kto:ct.name||b.kto});if(!c.rola&&zbIsRole(ct.role))c.rola=ct.role;}}}
    return c;};
  const ids=S.d.zab.filter(x=>(x.personal||[]).some(r=>fix(r))).map(x=>x.id);
  if(!ids.length)return;
  S.zb.migP=true;
  (async()=>{try{for(const id of ids)await zbSave(id,y=>{let ch=false;const a=(y.personal||[]).map(r=>{const c=fix(r);if(c){ch=true;return c;}return r;});return ch?{personal:a}:null;});}
    finally{S.zb.migP=false;}})();
}

/* drag a row by its handle (mouse, touch) or move it with arrow keys; sel = attribute prefix shared by the handles of one list */
function zbDrag(h,from,sel,moveTo){
  h.onkeydown=e=>{if(e.key!=="ArrowUp"&&e.key!=="ArrowDown")return;e.preventDefault();const d=e.key==="ArrowUp"?from-1:from+1;if(d<0)return;moveTo(d);
    setTimeout(()=>{const nh=document.querySelector(`${sel}${d}"]`);if(nh)nh.focus();},80);};
  h.onpointerdown=e=>{
    if(e.button>0)return;e.preventDefault();
    const row=h.closest("[data-zbrow],[data-zbsrow]"),box=row.parentElement,rows=[...box.children].filter(r=>r.dataset&&(r.dataset.zbrow!==undefined||r.dataset.zbsrow!==undefined));
    const main=$("#main");let to=from,moved=false,sy=e.clientY,timer=null,lastY=e.clientY;
    try{h.setPointerCapture(e.pointerId);}catch(_){}
    const clear=()=>rows.forEach(r=>r.classList.remove("dropa","dropb"));
    const place=y=>{clear();let t=rows.length;for(let j=0;j<rows.length;j++){const b=rows[j].getBoundingClientRect();if(y<b.top+b.height/2){t=j;break;}}
      to=t;if(t<rows.length)rows[t].classList.add("dropb");else rows[rows.length-1].classList.add("dropa");};
    const scroll=()=>{if(!main)return;const r=main.getBoundingClientRect();const d=lastY<r.top+70?-14:lastY>r.bottom-70?14:0;if(d){main.scrollTop+=d;place(lastY);}};
    const move=ev=>{lastY=ev.clientY;if(!moved){if(Math.abs(ev.clientY-sy)<4)return;moved=true;row.classList.add("dragging");document.body.classList.add("zb-dragging");timer=setInterval(scroll,30);}place(ev.clientY);};
    const end=()=>{h.removeEventListener("pointermove",move);h.removeEventListener("pointerup",end);h.removeEventListener("pointercancel",end);clearInterval(timer);
      clear();row.classList.remove("dragging");document.body.classList.remove("zb-dragging");if(!moved)return;const d=to>from?to-1:to;if(d!==from)moveTo(d);};
    h.addEventListener("pointermove",move);h.addEventListener("pointerup",end);h.addEventListener("pointercancel",end);
  };
}

  v.querySelectorAll("[data-zbnew]").forEach(b=>b.onclick=async()=>{
    const ord=Math.max(0,...S.d.zab.map(x=>+x.ord||0))+1;S.zb.f="all";
    const id=await add("zab",{ord,title:"",author:"",stav:"navrh",napajanie:"",technika:[],personal:[],ulohy:[],poznamka:""});
    if(id)setTimeout(()=>{const el=document.getElementById(`zb-${id}-title`);if(el){el.scrollIntoView({block:"center"});el.focus();}},50);
  });
}

function bindView(){
  const v=$("#view");zbBind(v);const on=(sel,ev,fn)=>{const el=v.querySelector(sel);if(el)el.addEventListener(ev,fn);};
  v.querySelectorAll("[data-etab]").forEach(b=>b.onclick=()=>{S.ef.tab=b.dataset.etab;render();});
  v.querySelectorAll("[data-emode]").forEach(b=>b.onclick=()=>{S.ef.mode=b.dataset.emode;render();});
  v.querySelectorAll("[data-gtab]").forEach(b=>b.onclick=()=>{S.gf.tab=b.dataset.gtab;render();});
  v.querySelectorAll("[data-ptab]").forEach(b=>b.onclick=()=>{S.ptab=b.dataset.ptab;render();});
  v.querySelectorAll("[data-pfyear]").forEach(b=>b.onclick=()=>{S.pf2.year=b.dataset.pfyear;render();});
  v.querySelectorAll("[data-pftab]").forEach(b=>b.onclick=()=>{S.pf2.tab=b.dataset.pftab;render();});
  v.querySelectorAll("[data-pm]").forEach(b=>b.onclick=()=>{S.pm=b.dataset.pm;render();});
  v.querySelectorAll(".gcard").forEach(c=>c.onkeydown=ev=>{if(ev.key==="Enter")c.click();});
  v.querySelectorAll("[data-pf]").forEach(b=>b.onclick=()=>{S.pf=b.dataset.pf;render();});
  v.querySelectorAll("[data-tmode]").forEach(b=>b.onclick=()=>{S.tf.mode=b.dataset.tmode;render();});
  v.querySelectorAll("[data-gmode]").forEach(b=>b.onclick=()=>{S.gf.mode=b.dataset.gmode;render();});
  v.querySelectorAll("[data-grtab]").forEach(b=>b.onclick=()=>{S.grtab=b.dataset.grtab;render();});
  on("#g-text","change",e=>upd("grants",S.id,{text:e.target.value}));v.querySelectorAll("[data-gf]").forEach(t=>t.onchange=()=>upd("grants",S.id,{[t.dataset.gf]:t.value}));v.querySelectorAll("[data-callimp]").forEach(b=>b.onclick=()=>callImport(b.dataset.callimp));
  v.querySelectorAll("[data-evtab]").forEach(b=>b.onclick=()=>{S.evtab=b.dataset.evtab;render();});
  {const ev=S.view==="podujatie"&&get("events",S.id);if(ev){
    const setEv=d=>upd("events",ev.id,d);
    v.querySelectorAll("[data-evbmode]").forEach(x=>x.onclick=()=>{S.evb.mode=x.dataset.evbmode;render();});v.querySelectorAll("[data-unl]").forEach(x=>x.onclick=()=>{S.evb.unl=!S.evb.unl;render();});
    v.querySelectorAll("[data-evb]").forEach(x=>x.onclick=()=>{if(x._moved){x._moved=false;return;}const k=x.dataset.evb,now=Date.now(),lc=S._evbClick;S._evbClick={k,t:now};
      if(k&&k!=="__none"&&lc&&lc.k===k&&now-lc.t<450){S._evbClick=null;const b2=v.querySelector(`[data-evbdrag="${CSS.escape(k)}"]`);if(b2)evbEdit(b2,ev,k);return;}
      if(S.evb.mode==="sekcie")S.evb.sec=k;else S.evb.gr=k;render();});
    {const keys=()=>[...v.querySelectorAll("[data-evbdrag]")].map(x=>x.dataset.evbdrag);let D=null;
    const clear=()=>v.querySelectorAll(".dropl,.dropr,.dragging").forEach(y=>y.classList.remove("dropl","dropr","dragging"));
    const target=(x,y,ex)=>{const el=document.elementFromPoint(x,y);const t=el&&el.closest&&el.closest("[data-evbdrag]");return t&&t!==ex?t:null;};
    const start=()=>{D.on=true;D.el.classList.add("dragging");document.body.style.userSelect="none";};
    const move=ev2=>{if(!D)return;const dx=ev2.clientX-D.x,dy=ev2.clientY-D.y;
      if(!D.on){if(D.touch){if(Math.abs(dx)>8||Math.abs(dy)>8){clearTimeout(D.tm);D=null;}return;}if(Math.abs(dx)>6)start();else return;}
      ev2.preventDefault();v.querySelectorAll(".dropl,.dropr").forEach(y=>y.classList.remove("dropl","dropr"));
      const t=target(ev2.clientX,ev2.clientY,D.el);if(t){const r=t.getBoundingClientRect();t.classList.add(ev2.clientX>r.left+r.width/2?"dropr":"dropl");}};
    const up=ev2=>{if(!D)return;clearTimeout(D.tm);const d=D;D=null;document.body.style.userSelect="";
      window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);window.removeEventListener("touchmove",tmove);
      if(!d.on){return;}d.el._moved=true;const t=target(ev2.clientX,ev2.clientY,d.el);clear();if(!t)return;
      const r=t.getBoundingClientRect(),after=ev2.clientX>r.left+r.width/2;const k=d.el.dataset.evbdrag;
      const a=keys().filter(x=>x!==k);let i=a.indexOf(t.dataset.evbdrag);if(after)i++;a.splice(i,0,k);
      setEv(S.evb.mode==="sekcie"?{sections:a}:{provOrder:a});};
    const tmove=ev2=>{if(D&&D.on)ev2.preventDefault();};
    v.querySelectorAll("[data-evbdrag]").forEach(x=>x.addEventListener("pointerdown",ev2=>{if(ev2.button>0)return;
      D={el:x,x:ev2.clientX,y:ev2.clientY,on:false,touch:ev2.pointerType==="touch"};
      if(D.touch)D.tm=setTimeout(()=>{if(D&&!D.on){start();if(navigator.vibrate)try{navigator.vibrate(15);}catch(_){}}},350);
      window.addEventListener("pointermove",move,{passive:false});window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);window.addEventListener("touchmove",tmove,{passive:false});}));}
    on("#evb-newsec","keydown",e=>{if(e.key!=="Enter")return;const t=e.target.value.trim();if(!t)return;const a=[...(ev.sections||[])];if(!a.includes(t))a.push(t);S.evb.sec=t;if(!baseCats().includes(t))saveSettings({cats:[...baseCats(),t]});setEv({sections:a});});
    on("#ev-dram","change",e=>setEv({dramaturgy:e.target.value}));
    on("#ev-mkt","change",e=>setEv({marketing:e.target.value}));
    on("#ev-prog-add","click",()=>setEv({program:[...(ev.program||[]),{time:"",title:"",contactId:"",place:""}]}));
    v.querySelectorAll("[data-prog]").forEach(inp=>inp.onchange=()=>{const[i,k]=inp.dataset.prog.split(":");const a=(ev.program||[]).map(x=>({...x}));if(!a[+i])return;a[+i][k]=inp.value;setEv({program:a});});
    v.querySelectorAll("[data-progdel]").forEach(x=>x.onclick=()=>{const a=(ev.program||[]).filter((_,i)=>i!==+x.dataset.progdel);setEv({program:a});});
    v.querySelectorAll("[data-mk]").forEach(x=>x.onclick=ev2=>{ev2.stopPropagation();const a=evMkt(ev).map(y=>({...y}));a[+x.dataset.mk].d=!a[+x.dataset.mk].d;setEv({mkt:a});});
    v.querySelectorAll("[data-mkdel]").forEach(x=>x.onclick=()=>{setEv({mkt:evMkt(ev).filter((_,i)=>i!==+x.dataset.mkdel)});});
    on("#ev-mk-add","keydown",e=>{if(e.key!=="Enter"||!e.target.value.trim())return;const a=evMkt(ev).map(y=>({...y}));a.push({t:e.target.value.trim(),d:false});e.target.value="";setEv({mkt:a});});
    v.querySelectorAll("[data-docdel]").forEach(x=>x.onclick=async()=>{if(await ask("Odstrániť dokument zo zoznamu?","Odstrániť"))setEv({docs:(ev.docs||[]).filter((_,i)=>i!==+x.dataset.docdel)});});
    on("#ev-doc-link","click",()=>{const f=$("#ev-doc-form");f.hidden=!f.hidden;if(!f.hidden)$("#ev-doc-name").focus();});
    on("#ev-doc-save","click",()=>{const n=$("#ev-doc-name").value.trim(),u=$("#ev-doc-url").value.trim();if(!u){toast("Vložte odkaz.");return;}setEv({docs:[...(ev.docs||[]),{name:n||u,url:u,at:Date.now()}]});});
    on("#ev-doc-file","change",async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const d=await uploadDoc(f,{en:"events",id:ev.id,kind:""});e.target.value="";if(d)await setEv({docs:[...(ev.docs||[]),Object.assign(d,{at:Date.now()})]});});
  }}
  v.querySelectorAll("[data-fyear]").forEach(b=>b.onclick=()=>{S.ff.year=b.dataset.fyear;render();});v.querySelectorAll("[data-fftoggle]").forEach(b=>b.onclick=()=>{S.ffOpen=!S.ffOpen;render();});v.querySelectorAll("[data-ffclear]").forEach(b=>b.onclick=()=>{Object.assign(S.ff,{acct:"",type:"",project:"",grant:""});render();});
  v.querySelectorAll("[data-ftab]").forEach(b=>b.onclick=()=>{S.ff.tab=b.dataset.ftab;render();});
  ["project","who","type","org"].forEach(k=>on("#tf-"+k,"change",e=>{S.tf[k]=e.target.value;render();}));
  on("#tf-q","input",e=>{S.tf.q=e.target.value;render();});
  on("#tf-alldone","click",()=>{S.tf.allDone=!S.tf.allDone;render();});
  on("#qa","keydown",async e=>{if(e.key!=="Enter"||!e.target.value.trim())return;const t=e.target.value.trim();e.target.value="";
    const d={title:t,status:"inbox",priority:"normalne",org:"ars"};if(S.tf.project)d.projectId=S.tf.project;if(S.tf.who==="__me"&&meId())d.assignee=meId();await add("tasks",d);});
  ["year","acct","type","project","grant"].forEach(k=>on("#ff-"+k,"change",e=>{S.ff[k]=e.target.value;render();}));
  on("#ff-q","input",e=>{S.ff.q=e.target.value;render();});
  on("#cf-q","input",e=>{S.cf.q=e.target.value;render();});
  v.querySelectorAll("[data-cvol]").forEach(b=>b.onclick=()=>{S.cf.tag=S.cf.tag===b.dataset.cvol?"":b.dataset.cvol;render();});
  v.querySelectorAll("[data-ctab]").forEach(b=>b.onclick=()=>{S.cf.tab=b.dataset.ctab;S.cf.tag="";render();});
  on("#cf-state","change",e=>{S.cf.state=e.target.value;render();});
  on("#cf-ev","change",e=>{S.cf.ev=e.target.value;render();});
  on("#cf-copy","click",async()=>{const m=(S._clist||[]).filter(c=>c.email).map(c=>c.email).join(", ");try{await navigator.clipboard.writeText(m);toast("E-maily skopírované.");}catch(_){toast("Kopírovanie nie je dostupné.");}});
  on("#ef-past","click",()=>{S.ef.past=!S.ef.past;render();});
  on("#pj-ledger","click",e=>{S.ff=Object.assign(S.ff,{tab:"dennik",project:e.target.dataset.pid,grant:"",year:String(new Date().getFullYear()),acct:"",type:"",q:""});go("financie");});
  on("#cal-prev","click",()=>{S.cal.m--;if(S.cal.m<0){S.cal.m=11;S.cal.y--;}render();});
  on("#cal-next","click",()=>{S.cal.m++;if(S.cal.m>11){S.cal.m=0;S.cal.y++;}render();});
  on("#cal-now","click",()=>{const n=new Date();S.cal={y:n.getFullYear(),m:n.getMonth()};render();});
  on("#g-ck-add","keydown",e=>{if(e.key!=="Enter"||!e.target.value.trim())return;const g=get("grants",S.id);const a=(g.checklist||[]).map(x=>({...x}));a.push({t:e.target.value.trim(),d:false});e.target.value="";upd("grants",g.id,{checklist:a});});
  on("#st-bank","change",e=>saveSettings({openBank:e.target.value===""?null:+e.target.value}));
  on("#st-cash","change",e=>saveSettings({openCash:e.target.value===""?null:+e.target.value}));
  on("#st-cats","change",e=>saveSettings({cats:e.target.value.split("\n").map(s=>s.trim()).filter(Boolean)}));
  on("#st-types","change",e=>saveSettings({ttypes:e.target.value.split("\n").map(s=>s.trim()).filter(Boolean)}));
  bindDnD(v);
}
$("#sidescrim").onclick=closeSide;
document.addEventListener("keydown",e=>{if(e.altKey&&e.key==="ArrowLeft"){e.preventDefault();goBack();}});
boot();

})();
