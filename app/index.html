.check.on{background:var(--good);border-color:var(--good)}
.check.pd{width:14px;height:14px;border-radius:4px;border-width:1.5px}.check.pd.on{background:var(--accent);border-color:var(--accent)}.check.pd.on::after{width:4px;height:7px}td.pdc{width:22px;padding-left:2px;padding-right:10px}

.tw{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse;font-size:14px}
.addic{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:18px;height:18px;margin-left:6px;border-radius:5px;font-size:15px;font-weight:600;line-height:1;color:var(--muted);vertical-align:-3px}.addic:hover{background:var(--accent-soft);color:var(--accent)}
.addrow{all:unset;cursor:pointer;color:var(--muted);font-size:13.5px;padding:2px 0}.addrow:hover{color:var(--accent)}tr.addln td{border-bottom:0;padding-top:6px;padding-bottom:6px}
.glines{border:1px solid var(--line);border-radius:12px;padding:6px 14px 10px;margin:4px 0 14px;background:var(--surface2)}
table.lt td{padding:7px 8px}table.lt td.t{display:flex;gap:8px;align-items:baseline;min-width:0}
.lbar{position:relative;height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:80px}.lbar i{position:absolute;top:0;bottom:0;left:0;background:var(--accent);border-radius:4px 0 0 4px}.lbar i.pl{background:var(--accent);opacity:.35;border-radius:0}.lbar.over i{background:#C2372E}
.lst{font-size:12px;font-weight:600;white-space:nowrap}.lst.ok{color:var(--good)}.lst.warn{color:#C08A12}.lst.bad{color:#C2372E}tr.unl td{color:var(--muted)}.ldg td{white-space:nowrap}.ldg td.lgr>span,.ldg td.lct>*{display:inline-block;max-width:140px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}.ldg td.ldsc .cut{max-width:170px}td.ldsc{max-width:200px}td.ldsc .cut{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fbtn{position:relative;display:inline-flex;align-items:center;gap:6px;padding:7px 10px}.fbtn.on{background:var(--accent-soft);color:var(--accent)}.fcount{font-size:11px;font-weight:700;background:var(--accent);color:#fff;border-radius:9px;padding:0 6px;line-height:16px}.tools.frow{margin-top:-6px}.tools .fsearch{margin-left:auto;width:240px}.tools.frow select{width:180px;max-width:180px;text-overflow:ellipsis}.dtop .btn.on{background:var(--accent-soft);color:var(--accent)}.bgraph{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:22px 16px 12px;margin-bottom:16px;display:grid;gap:8px}
.bgr{display:grid;grid-template-columns:160px 1fr;align-items:center;gap:12px}.bgl{display:flex;justify-content:space-between;gap:8px;font-size:13px}.bgl span{font-weight:700;font-variant-numeric:tabular-nums}
.bgt{height:14px;display:flex}
.bgt i{display:block;height:100%;cursor:default;position:relative}.bgt i:first-child{border-radius:7px 0 0 7px}.bgt i:last-child{border-radius:0 7px 7px 0}.bgt i:only-child{border-radius:7px}.bgt i:hover::after,.bgt i:focus::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);font-size:12px;font-weight:600;font-style:normal;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:5;pointer-events:none;opacity:1;filter:none}.bgt i:hover{filter:brightness(1.15)}.bgt i.pos{background:var(--good)}.bgt i.neg{background:var(--bad)}.bgt i.pl{background-image:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,0))}.bgt i.pos.pl{background:color-mix(in srgb,var(--good) 40%,var(--surface))}.bgt i.neg.pl{background:color-mix(in srgb,var(--bad) 40%,var(--surface))}.bgt i.fr{background:var(--line)}
.bgm{display:flex;gap:12px;font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}.bgm .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}.dot.pos{background:var(--good)}.dot.neg{background:var(--bad)}.dot.pl{opacity:.38}
.bgbal{font-size:12px;color:var(--muted);text-align:right}.bgbal b{font-size:13px}

.pgh{display:flex;align-items:center;gap:8px;margin:18px 0 6px;font-size:14px}.pgt td{white-space:nowrap}.pgt td .cut{display:block;max-width:220px;overflow:hidden;text-overflow:ellipsis}.pgt .miss{color:var(--muted);opacity:.6}small.cprov{display:block;font-size:11px;color:var(--muted);font-weight:400;line-height:1.2;margin-top:1px}
select.lsel{max-width:180px;padding:3px 6px;font-size:13px;border-color:transparent;background:transparent}select.lsel:hover,select.lsel:focus{border-color:var(--line);background:var(--surface)}

/* bars */

    {k:"needOrg",l:"Organizačne treba",t:"long"},{k:"needMat",l:"Materiál a technika",t:"long"},{k:"eventId",l:"Podujatie",t:"rel",e:"events"},{k:"note",l:"Poznámka",t:"long"}]},

  comments:{col:"comments"}

const KEYS=Object.keys(ENT);

/* ================= state ================= */
const S={d:{},settings:{},people:{},me:null,view:"prehlad",id:null,live:false,loading:true,readOnly:false,
  tf:{project:"",who:"",org:"",type:"",q:"",mode:"board",allDone:false},
  gf:{mode:"board"}, ef:{past:false}, ff:{tab:"dennik",year:String(new Date().getFullYear()),acct:"",type:"",project:"",grant:"",q:""},
  cf:{q:"",role:""}, pf:"aktivne", cal:null};
KEYS.forEach(k=>S.d[k]=[]);
let db=null,user=null,dl=null,assets=null,mcp=null;

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf2=new Intl.NumberFormat("sk-SK",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2});
const nf0=new Intl.NumberFormat("sk-SK",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const eur=n=>nf2.format(Number(n)||0), eur0=n=>nf0.format(Number(n)||0);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d);};
const fdate=d=>{if(!d)return"";const[y,m,dd]=d.split("-");return`${+dd}. ${+m}. ${y}`;};
const fdateS=d=>{if(!d)return"";const[y,m,dd]=d.split("-");return y===String(new Date().getFullYear())?`${+dd}. ${+m}.`:`${+dd}. ${+m}. ${y}`;};
const daysTo=d=>d?Math.round((new Date(d+"T12:00:00")-new Date(today()+"T12:00:00"))/864e5):null;
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const get=(e,id)=>id?S.d[e].find(x=>x.id===id):null;
const ttl=(e,r)=>r?(r[ENT[e].title]||"Bez názvu"):"";
const meId=()=>S.me&&S.me.id||null;
const optL=(o,k)=>(OPT[o].find(x=>x[0]===k)||[k,k||""])[1];
const optC=(o,k)=>(OPT[o].find(x=>x[0]===k)||[0,0,GRAY])[2];
const chip=(o,k)=>k?`<span class="chip"><i style="background:${optC(o,k)}"></i>${esc(optL(o,k))}</span>`:"";
const pcolor=id=>(get("projects",id)||{}).color||GRAY;
const pdot=id=>{const p=get("projects",id);return p?`<span class="row" style="gap:6px;flex-wrap:nowrap"><i class="dot" style="background:${esc(p.color||GRAY)}"></i><span class="cut">${esc(p.name||"Bez názvu")}</span></span>`:"";};
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const baseCats=()=>(S.settings.cats&&S.settings.cats.length)?S.settings.cats:DEF_CATS;
const cats=()=>{const a=[...baseCats()];const add=c=>{c=(c||"").trim();if(c&&!a.includes(c))a.push(c);};(S.d.ledger||[]).forEach(x=>add(x.category));(S.d.events||[]).forEach(e=>(e.sections||[]).forEach(add));return a;};
const ttypes=()=>(S.settings.ttypes&&S.settings.ttypes.length)?S.settings.ttypes:DEF_TTYPES;
const isDone=t=>t.status==="hotove";
const pct=(a,b)=>b?Math.round(a/b*100):0;
function rel(ts){if(!ts)return"";const m=Math.round((Date.now()-ts)/6e4);if(m<1)return"práve teraz";if(m<60)return`pred ${m} min`;const h=Math.round(m/60);if(h<24)return`pred ${h} h`;const d=Math.round(h/24);if(d===1)return"včera";if(d<7)return`pred ${d} dňami`;return fdate(iso(new Date(ts)));}
function personName(v){if(!v)return"";if(v[0]==="~")return v.slice(1);const p=S.people[v];if(p&&p.name)return p.name;if(S.me&&v===S.me.id)return S.me.name||"Vy";return"Člen tímu";}
function avatar(v){const p=v&&v[0]!=="~"&&S.people[v];return p&&p.avatarUrl?`<img class="av sm" alt="" src="${esc(p.avatarUrl)}">`:"";}
function who(v){const n=personName(v);return n?`<span class="row" style="gap:5px;flex-wrap:nowrap">${avatar(v)}${esc(n)}</span>`:"";}
function bar(val,max,color,val2){const p=Math.min(pct(val,max),100),p2=val2?Math.min(pct(val+val2,max),100):0;return`<div class="bar">${val2?`<i class="b2" style="width:${p2}%"></i>`:""}<i class="${pct(val,max)>100?"over":""}" style="width:${p}%;${color?`background:${esc(color)}`:""}"></i></div>`;}
function dueHtml(d,done){if(!d)return"";const n=daysTo(d);if(!done&&n<0)return`<span class="late">${fdateS(d)}</span>`;if(!done&&n===0)return`<span class="late">dnes</span>`;if(n===1)return"zajtra";return fdateS(d);}
function toast(msg,ms){document.querySelectorAll(".toast").forEach(t=>t.remove());const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=msg;el.onclick=()=>el.remove();document.body.appendChild(el);setTimeout(()=>el.remove(),ms||3200);}
function ask(msg,okLabel){return new Promise(res=>{const L=$("#layer2");L.innerHTML=`<div class="scrim"><div class="modal" role="alertdialog" aria-modal="true"><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-a="0">Zrušiť</button><button class="btn pri" data-a="1">${esc(okLabel||"Potvrdiť")}</button></div></div></div>`;const done=v=>{L.innerHTML="";res(v);};L.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>done(b.dataset.a==="1"));L.querySelector('[data-a="1"]').focus();});}

/* normalize older records (v1 of the app) */
const MAP={pstat:{bezi:"prebieha",ukonceny:"dokoncene",pozastaveny:"pozastavene"},tstat:{todo:"inbox",doing:"rozpracovane",done:"hotove"},prio:{vysoka:"urgentne",bezna:"normalne"}};
function norm(e,o){
  if(e==="projects"){o.status=MAP.pstat[o.status]||o.status||"priprava";if(!o.lead&&o.leadText)o.lead="~"+o.leadText;}
  if(e==="tasks"){o.status=MAP.tstat[o.status]||o.status||"inbox";o.priority=MAP.prio[o.priority]||o.priority;if(!o.assignee&&o.assigneeText)o.assignee="~"+o.assigneeText;}
  if(e==="events"&&o.grantId&&!Array.isArray(o.grantIds)){o.grantIds=[o.grantId];}
  if(e==="ledger"){if(!o.docNo&&o.doc)o.docNo=o.doc;o.type=o.type||"vydavok";o.account=o.account||"banka";}
  return o;
}

/* ================= data layer ================= */
async function write(fn){
  if(S.readOnly){toast("Máte len prístup na čítanie.");return false;}
  try{await fn();return true;}
  catch(e){
    if(e&&e.code==="invalid_argument"){toast("Zmena sa neuložila – nemáte právo upravovať, alebo je záznam príliš veľký.");}
    else if(e&&e.code==="quota_exceeded")toast("Databáza je plná. Zmažte staré záznamy.");
    else if(e&&e.code==="resource_exhausted")toast("Príliš veľa zmien naraz. Skúste to o chvíľu.");
    else toast("Zmenu sa nepodarilo uložiť. Skúste to znova.");
    return false;
  }
}
async function add(e,data){
  const t=Date.now(),doc=Object.assign({createdAt:t,updatedAt:t},meId()?{createdBy:meId(),updatedBy:meId()}:{},data);
  let id=null;
  const ok=await write(async()=>{
    if(db){const ref=db.collection(ENT[e].col).doc();id=ref.id;await ref.set(doc);}
    else{id=rid();S.d[e].push(Object.assign({id},doc));render();}
  });
  return ok?id:null;
}
function upd(e,id,patch){
  patch=Object.assign({},patch,{updatedAt:Date.now()},meId()?{updatedBy:meId()}:{});
  return write(async()=>{
    if(db)await db.doc(ENT[e].col+"/"+id).update(patch);
    else{Object.assign(get(e,id),patch);render();}
  });
}
function del(e,id){
  return write(async()=>{
    if(db)await db.doc(ENT[e].col+"/"+id).delete();
    else{S.d[e]=S.d[e].filter(x=>x.id!==id);render();}
  });
}
function saveSettings(patch){
  const next=Object.assign({},S.settings,patch);
  return write(async()=>{if(db)await db.doc("settings/main").set(next);else{S.settings=next;render();}});
}

let peopleT=null;
function refreshPeople(){
  if(!user)return;clearTimeout(peopleT);
  peopleT=setTimeout(async()=>{
    const ids=new Set();
    const addv=v=>{if(v&&v[0]!=="~")ids.add(v);};
    S.d.tasks.forEach(t=>addv(t.assignee));["projects","grants","events"].forEach(e=>S.d[e].forEach(x=>addv(x.lead)));
    KEYS.forEach(e=>S.d[e].forEach(x=>{addv(x.updatedBy);addv(x.createdBy);}));
    if(!ids.size)return;
    const ps=await user.profiles([...ids]);let ch=false;
    for(const id in ps){const o=S.people[id];if(!o||o.name!==ps[id].name||o.avatarUrl!==ps[id].avatarUrl)ch=true;}
    S.people=Object.assign({},S.people,ps);if(ch)render();
  },150);
}

async function boot(){
  const now=new Date();S.cal={y:now.getFullYear(),m:now.getMonth()};
  render();
  const C=window.claude;const use=n=>(C&&typeof C.use==="function")?C.use(n):Promise.resolve(null);
  [db,user,dl,assets,mcp]=await Promise.all([use("db"),use("user"),use("downloads"),use("assets"),use("mcp")]);
  if(user){S.me=await user.me();const can=await user.can("data.write");if(can===false)S.readOnly=true;}
  if(db){
    S.live=true;let pending=KEYS.length+1;
    const done=()=>{if(pending>0&&--pending===0)S.loading=false;};
    KEYS.forEach(e=>db.collection(ENT[e].col).onSnapshot(snap=>{
      S.d[e]=snap.docs.map(d=>norm(e,Object.assign({id:d.id},d.data())));
      done();refreshPeople();render();
    },err=>{done();if(err&&err.code!=="revoked")toast("Spojenie s databázou sa prerušilo. Obnovte stránku.");render();}));
    db.doc("settings/main").onSnapshot(s=>{S.settings=s.exists?Object.assign({},s.data()):{};done();render();},()=>{done();});
  }else S.loading=false;
  render();
}
/* ================= computations ================= */
function ledgerCalc(){
  const list=[...S.d.ledger].sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.createdAt||0)-(b.createdAt||0));
  let bank=+S.settings.openBank||0,cash=+S.settings.openCash||0;const seq={},map={};
  list.forEach(x=>{
    const y=(x.date||"").slice(0,4)||"—";seq[y]=(seq[y]||0)+1;
    const moves=x.state!=="barter"&&x.paid!==false;const s=(x.type==="prijem"?1:-1)*(+x.amount||0);
    if(moves){if(x.account==="hotovost")cash+=s;else bank+=s;}
    map[x.id]={seq:seq[y],bank,cash};
  });
  return{map,bank,cash,list};
}
function grantCalc(g){
  const L=S.d.ledger.filter(x=>x.grantId===g.id);let sg=0,sc=0,rec=0;
  L.forEach(x=>{const a=+x.amount||0;if(x.type==="prijem")rec+=a;else if(x.cofin)sc+=a;else sg+=a;});
  const appr=+g.approved||0;return{L,sg,sc,rec,appr,rest:appr-sg,cofinReq:+g.cofinReq||0};
}
function lineCalc(l){
  const L=S.d.ledger.filter(x=>x.lineId===l.id&&x.type!=="prijem");let sg=0,sc=0;
  L.forEach(x=>{if(x.cofin)sc+=+x.amount||0;else sg+=+x.amount||0;});return{L,sg,sc,spent:sg+sc};
}
function projCalc(p){
  const L=S.d.ledger.filter(x=>x.projectId===p.id);
  const inc=sum(L.filter(x=>x.type==="prijem"),x=>x.amount),exp=sum(L.filter(x=>x.type!=="prijem"),x=>x.amount);
  const T=S.d.tasks.filter(t=>t.projectId===p.id);
  return{L,inc,exp,T,open:T.filter(t=>!isDone(t)).length,done:T.filter(isDone).length};
}
const ACTIVE_G=["priprava","podane","schvalene","zrealizovane"];
/* all dated things → for dashboard & calendar */
function agenda(){
  const out=[];
  S.d.tasks.forEach(t=>{if(t.due)out.push({d:t.due,kind:"task",c:"var(--accent)",txt:t.title||"Úloha",open:"tasks:"+t.id,done:isDone(t),pid:t.projectId,mine:t.assignee&&t.assignee===meId()});});
  S.d.events.forEach(e=>{if(e.date){const end=e.dateTo&&e.dateTo>e.date?e.dateTo:e.date;let d=e.date,i=0;while(d<=end&&i<40){out.push({d,kind:"event",c:PINK,txt:(e.name||"Podujatie")+(e.time&&d===e.date?" · "+e.time:""),open:"events:"+e.id,done:e.status==="zrealizovane",pid:e.projectId});d=addDays(d,1);i++;}}});
  S.d.grants.forEach(g=>{
    const closed=["vyuctovane","nepodporene"].includes(g.status);
    if(g.submitTo)out.push({d:g.submitTo,kind:"grant",c:OCHRE,txt:"Uzávierka: "+(g.name||"grant"),open:"grants:"+g.id,done:closed||g.status!=="napad"&&g.status!=="priprava",pid:g.projectId});
    if(g.realTo)out.push({d:g.realTo,kind:"grant",c:OCHRE,txt:"Koniec realizácie: "+(g.name||"grant"),open:"grants:"+g.id,done:closed,pid:g.projectId});
    if(g.settleDue)out.push({d:g.settleDue,kind:"grant",c:RED,txt:"Vyúčtovanie: "+(g.name||"grant"),open:"grants:"+g.id,done:g.status==="vyuctovane"||g.status==="nepodporene",pid:g.projectId});
  });
  S.d.projects.forEach(p=>{if(p.end&&p.status!=="dokoncene")out.push({d:p.end,kind:"project",c:GREEN,txt:"Koniec projektu: "+(p.name||""),open:"projects:"+p.id,done:false,pid:p.id});});
  return out.sort((a,b)=>a.d.localeCompare(b.d));
}

/* ================= navigation ================= */
function go(view,id,isBack){
  id=id||null;
  if(!isBack&&(S.view!==view||S.id!==id)){S.hist=S.hist||[];S.hist.push({view:S.view,id:S.id});if(S.hist.length>50)S.hist.shift();try{history.pushState({n:S.hist.length},"");}catch(_){}}
  S.view=view;S.id=id;closeSide();
  if(view!=="projekt"&&view!=="grant"&&view!=="podujatie")closeDrawer();
  render();const m=$("#main");if(m)m.scrollTop=0;
}
function goBack(){
  if(DW){closeDrawer();return;}
  const h=(S.hist||[]).pop();if(h)go(h.view,h.id,true);else if(S.view!=="prehlad")go("prehlad",null,true);
}
window.addEventListener("popstate",()=>{if((S.hist||[]).length||DW)goBack();});
function navBar(){
  const sec=ACT[S.view]||S.view,secL=(NAV.find(n=>n!=="-"&&n[0]===sec)||[0,""])[1];
  const ent={projekt:"projects",grant:"grants",podujatie:"events"}[S.view];const r=ent&&get(ent,S.id);
  const can=(S.hist||[]).length||S.view!=="prehlad";
  return`<div class="navbar"><button class="nb-back" data-back ${can?"":"disabled"} aria-label="Späť" title="Späť (Alt+←)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>Späť</button>
  <nav class="nb-path" aria-label="Kde som">${S.view!=="prehlad"?`<button data-go="prehlad">Prehľad</button><span>/</span>`:""}${r?`<button data-go="${sec}">${esc(secL)}</button><span>/</span><b>${esc(ttl(ent,r))}</b>`:`<b>${esc(secL||"Prehľad")}</b>`}</nav></div>`;
}
function openRec(e,id){
  if(e==="zab")return go("zabezpecenie");
  if(e==="projects")return go("projekt",id);
  if(e==="grants")return go("grant",id);
  if(e==="events")return go("podujatie",id);
  openDrawer(e,id);
}
async function create(e,defs,opts){
  const base={};
  if(e==="tasks")Object.assign(base,{status:"inbox",priority:"normalne",org:"ars"});
  if(e==="ledger")Object.assign(base,{type:"vydavok",account:"banka",date:today(),state:"kryte",paid:true});
  if(e==="projects")Object.assign(base,{status:"priprava",color:COLORS[S.d.projects.length%COLORS.length]});
  if(e==="grants")Object.assign(base,{status:"napad",checklist:GRANT_CL.map(t=>({t,d:false}))});
  if(e==="events")Object.assign(base,{status:"priprava"});
  if(e==="prog")Object.assign(base,{status:"nevybavene",kind:"dielo",day:"oba"});
  if(e==="contacts")Object.assign(base,{ctype:"osoba"});
  const data=Object.assign(base,defs||{});
  if(!(ENT[e].title in data))data[ENT[e].title]="";
  const id=await add(e,data);
  if(id)openDrawer(e,id,true);
  return id;
}

/* ================= global events ================= */
document.addEventListener("click",e=>{
  const t=e.target;
  const q=s=>t.closest(s);
  let el;
  if((el=q("[data-ck-toggle]"))){e.stopPropagation();toggleCheck(el.dataset.ckToggle,+el.dataset.i);return;}
  if((el=q("[data-lpaid]"))){e.stopPropagation();const l=get("ledger",el.dataset.lpaid);if(l)upd("ledger",l.id,{paid:l.paid===false});return;}
  if((el=q("[data-done]"))){e.stopPropagation();const tk=get("tasks",el.dataset.done);if(tk)upd("tasks",tk.id,{status:isDone(tk)?"tyzden":"hotove",doneAt:isDone(tk)?null:Date.now()});return;}
  if(q("select"))return;
  if((el=q("[data-pdel]"))){e.stopPropagation();ask("Odobrať zo spolupráce?","Odobrať").then(ok=>{if(ok)del("partnerships",el.dataset.pdel);});return;}
  if((el=q("[data-pnew]"))){e.stopPropagation();const evId=el.dataset.pnew;(async()=>{const cid=await add("contacts",{name:"",ctype:"organizacia",role:"partner"});if(cid){await add("partnerships",{eventId:evId,contactId:cid,state:"oslovit"});openDrawer("contacts",cid,true);}})();return;}
  if((el=q("[data-unlink]"))){e.stopPropagation();const[a,b]=el.dataset.unlink.split("|");const[e1,i1]=a.split(":"),[t1,i2]=b.split(":");link(e1,i1,t1,i2,false);return;}
  if((el=q("[data-linknew]"))){e.stopPropagation();const[a,t1]=el.dataset.linknew.split("|");const[e1,i1]=a.split(":");linkNew(e1,i1,t1);return;}
  if(q("[data-back]")){goBack();return;}
  if((el=q("[data-go]"))){e.preventDefault();go(el.dataset.go,el.dataset.id);return;}
  if((el=q("[data-open]"))){if(q("a"))return;const[k,id]=el.dataset.open.split(":");openRec(k,id);return;}
  if((el=q("[data-peek]"))){const[k,id]=el.dataset.peek.split(":");openDrawer(k,id);return;}
  if((el=q("[data-create]"))){let defs={};try{defs=JSON.parse(el.dataset.defs||"{}");}catch(_){}closeNewMenu();create(el.dataset.create,defs);return;}
  if(q("[data-new]")){e.stopPropagation();newMenu(q("[data-new]"));return;}
  if(q("[data-search]")){closeSide();openSearch();return;}
  if(q("[data-menu]")){openSide();return;}
  if(q("[data-export]")){exportCsv(q("[data-export]").dataset.export,q("[data-export]").dataset.id);return;}
  if(!q(".newmenu"))closeNewMenu();
});
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openSearch();}
  else if(e.key==="Escape"){if($("#layer2").innerHTML)return;if($("#layer").innerHTML){$("#layer").innerHTML="";return;}if(DW)closeDrawer();closeNewMenu();closeSide();}
});
function newMenu(anchor){
  closeNewMenu();const r=anchor.getBoundingClientRect();
  const m=document.createElement("div");m.className="newmenu";m.id="newmenu";
  m.style.left=Math.min(r.left,innerWidth-220)+"px";m.style.top=(r.bottom+6)+"px";m.style.position="fixed";
  m.innerHTML=[["tasks","Úloha"],["events","Podujatie"],["ledger","Platba do denníka"],["grants","Grant"],["projects","Projekt"],["contacts","Kontakt"]].map(([k,l])=>`<button data-create="${k}">${l}</button>`).join("");
  document.body.appendChild(m);m.querySelector("button").focus();
}
function closeNewMenu(){const m=$("#newmenu");if(m)m.remove();}

/* drag & drop (boards) */
function bindDnD(root){
  root.querySelectorAll("[data-drag]").forEach(c=>c.ondragstart=ev=>{ev.dataTransfer.setData("text/plain",c.dataset.drag);});
  root.querySelectorAll("[data-drop]").forEach(col=>{
    col.ondragover=ev=>{ev.preventDefault();col.classList.add("drop");};
    col.ondragleave=()=>col.classList.remove("drop");
    col.ondrop=ev=>{ev.preventDefault();col.classList.remove("drop");
      const[k,id]=ev.dataTransfer.getData("text/plain").split(":");const[e2,f,v]=col.dataset.drop.split(":");
      if(k!==e2)return;const r=get(k,id);if(!r||r[f]===v)return;
      const patch={[f]:v};if(k==="tasks"&&v==="hotove")patch.doneAt=Date.now();upd(k,id,patch);};
  });
}
/* ================= drawer (record peek, Notion-like) ================= */
let DW=null;
function openDrawer(e,id,isNew){
  DW={e,id,isNew:!!isNew,edit:!!isNew};closeSide();
  const host=$("#drawer");
  host.innerHTML=`<div class="dscrim" data-dclose></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(ENT[e].one)}">
    <div class="dtop"><span class="kind">${esc(ENT[e].one)}</span>
      ${e==="projects"||e==="grants"||e==="events"?`<button class="btn ghost sm" data-dpage>Otvoriť stránku</button>`:""}
      ${e==="contacts"?`<button class="btn ghost sm${isNew?" on":""}" data-dedit title="Upraviť – zobraziť všetky polia" aria-label="Upraviť"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg> Upraviť</button>`:""}
      <button class="btn ghost sm danger" data-ddel>Zmazať</button><button class="btn ghost sm" data-dclose aria-label="Zavrieť">Zavrieť</button></div>
    <div class="dbody"><div id="dw-head"></div><div id="dw-props"></div><div id="dw-extra"></div></div></aside>`;
  host.hidden=false;
  host.querySelectorAll("[data-dclose]").forEach(b=>b.onclick=closeDrawer);
  const ed=host.querySelector("[data-dedit]");if(ed)ed.onclick=()=>{DW.edit=!DW.edit;ed.classList.toggle("on",DW.edit);drawerRefresh(true);};
  const pg=host.querySelector("[data-dpage]");if(pg)pg.onclick=()=>{const d=DW;closeDrawer();openRec(d.e,d.id);};

const MAIN=["projects","grants","events","tasks","ledger","contacts"];
const LINK_L={projects:"Projekty",grants:"Granty",events:"Podujatia",tasks:"Úlohy",ledger:"Platby",contacts:"Ľudia a kontakty"};
function linkFields(s,t){return(ENT[s].fields||[]).filter(f=>(f.t==="rel"||f.t==="mrel")&&f.e===t);}
function refIds(x,s,t){const o=[];linkFields(s,t).forEach(f=>{const v=x[f.k];if(Array.isArray(v))o.push(...v);else if(v)o.push(v);});return o;}
function related(e,r,t){const ids=new Set(refIds(r,e,t));S.d[t].forEach(x=>{if(refIds(x,t,e).includes(r.id))ids.add(x.id);});ids.delete(r.id);return[...ids].map(id=>get(t,id)).filter(Boolean);}
function setRef(x,f,id,on){
  if(f.t==="mrel"){const a=Array.isArray(x[f.k])?[...x[f.k]]:[];const i=a.indexOf(id);if(on&&i<0)a.push(id);if(!on&&i>=0)a.splice(i,1);return{[f.k]:a};}
  return{[f.k]:on?id:(x[f.k]===id?"":(x[f.k]||""))};
}
async function link(e,id,t,tid,on){
  const r=get(e,id),x=get(t,tid),own=linkFields(e,t),oth=linkFields(t,e);
  const ownM=own.find(f=>f.t==="mrel"),othM=oth.find(f=>f.t==="mrel");
  if(on){
    if(othM&&x)return upd(t,tid,setRef(x,othM,id,true));
    if(ownM&&r)return upd(e,id,setRef(r,ownM,tid,true));
    if(oth[0]&&x){const p=setRef(x,oth[0],id,true);if(t!=="projects"&&e==="grants"&&r&&r.projectId&&!x.projectId&&linkFields(t,"projects").some(f=>f.k==="projectId"))p.projectId=r.projectId;return upd(t,tid,p);}
    if(own[0]&&r)return upd(e,id,setRef(r,own[0],tid,true));
  }else{
    if(r&&refIds(r,e,t).includes(tid))await upd(e,id,Object.assign({},...own.map(f=>setRef(r,f,tid,false))));
    if(x&&refIds(x,t,e).includes(id))await upd(t,tid,Object.assign({},...oth.map(f=>setRef(x,f,id,false))));
  }
}
async function linkNew(e,id,t){
  const r=get(e,id);if(!r)return;const d={};
  const oth=linkFields(t,e).find(f=>f.t==="mrel")||linkFields(t,e)[0];
  if(oth)d[oth.k]=oth.t==="mrel"?[id]:id;
  ["projectId","grantId","eventId"].forEach(k=>{if(r[k]&&!(k in d)&&(ENT[t].fields||[]).some(f=>f.k===k))d[k]=r[k];});
  if(t==="contacts"&&r.projectId&&!d.projectIds)d.projectIds=[r.projectId];
  const nid=await create(t,d);
  if(nid&&!oth)link(e,id,t,nid,true);
}

VIEWS.kalendar=()=>{
  const{y,m}=S.cal;const first=new Date(y,m,1),off=(first.getDay()+6)%7;const start=new Date(y,m,1-off);
  const items={};agenda().forEach(a=>{(items[a.d]=items[a.d]||[]).push(a);});
  const td=today();const cells=[];
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const s=iso(d);
    const its=(items[s]||[]);
    cells.push(`<div class="d ${d.getMonth()!==m?"o":""} ${s===td?"td":""}"><span class="dn">${d.getDate()}</span>${its.slice(0,4).map(a=>`<button class="ce ${a.done?"done":""}" style="--c:${a.c}" data-open="${a.open}" title="${esc(a.txt)}">${esc(a.txt)}</button>`).join("")}${its.length>4?`<span class="meta" style="font-size:11px">+${its.length-4} ďalšie</span>`:""}</div>`);
    if(i>=34&&d.getMonth()!==m&&(i+1)%7===0)break;
  }
  const mname=first.toLocaleDateString("sk-SK",{month:"long",year:"numeric"});
  return`<div class="head"><div><h1 style="text-transform:capitalize">${esc(mname)}</h1><p class="sub">Podujatia, termíny úloh a grantové uzávierky na jednom mieste</p></div>
    <div class="row"><button class="btn" id="cal-prev" aria-label="Predchádzajúci mesiac">‹</button><button class="btn" id="cal-now">Dnes</button><button class="btn" id="cal-next" aria-label="Nasledujúci mesiac">›</button><button class="btn pri" data-create="events">Nové podujatie</button></div></div>
  <div class="cal">${["Po","Ut","St","Št","Pi","So","Ne"].map(d=>`<div class="dh">${d}</div>`).join("")}${cells.join("")}</div>
  <div class="legend"><span><i style="background:${PINK}"></i>Podujatia</span><span><i style="background:var(--accent)"></i>Termíny úloh</span><span><i style="background:${OCHRE}"></i>Žiadosti a realizácia grantov</span><span><i style="background:${RED}"></i>Vyúčtovania</span><span><i style="background:${GREEN}"></i>Konce projektov</span></div>`;
};

VIEWS.ulohy=()=>{
  const f=S.tf,me=meId();
  let list=S.d.tasks.filter(t=>(!f.project||t.projectId===f.project)&&(!f.org||t.org===f.org)&&(!f.type||(t.types||[]).includes(f.type))
    &&(!f.who||(f.who==="__me"?t.assignee===me:f.who==="__none"?!t.assignee:t.assignee===f.who))&&(!f.q||(t.title||"").toLowerCase().includes(f.q.toLowerCase())));
  const people=[...new Set(S.d.tasks.map(t=>t.assignee).filter(Boolean))];
  const tools=`<div class="tools">
    <input type="search" id="tf-q" placeholder="Hľadať v úlohách" value="${esc(f.q)}" aria-label="Hľadať">
    <select id="tf-project" aria-label="Projekt"><option value="">Všetky projekty</option>${S.d.projects.map(p=>`<option value="${esc(p.id)}" ${f.project===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select>
    <select id="tf-who" aria-label="Zodpovedný"><option value="">Všetci</option>${me?`<option value="__me" ${f.who==="__me"?"selected":""}>Moje</option>`:""}<option value="__none" ${f.who==="__none"?"selected":""}>Nepriradené</option>${people.filter(p=>p!==me).map(p=>`<option value="${esc(p)}" ${f.who===p?"selected":""}>${esc(personName(p))}</option>`).join("")}</select>
    <select id="tf-type" aria-label="Typ"><option value="">Všetky typy</option>${ttypes().map(x=>`<option ${f.type===x?"selected":""}>${esc(x)}</option>`).join("")}</select>
    <select id="tf-org" aria-label="Organizácia"><option value="">Ars Preuge aj KaSS</option>${OPT.org.map(o=>`<option value="${o[0]}" ${f.org===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select>
    <div class="tabs"><button data-tmode="board" aria-pressed="${f.mode==="board"}">Tabuľa</button><button data-tmode="list" aria-pressed="${f.mode==="list"}">Zoznam</button></div></div>`;
  const defs={};if(f.project)defs.projectId=f.project;if(f.who==="__me"&&me)defs.assignee=me;
  let body;
  if(!S.d.tasks.length)body=`<div class="panel">${emptyBox("Zatiaľ žiadne úlohy. Zapíšte prvú – do Inboxu môžete hádzať všetko, čo treba neskôr roztriediť.","tasks","Nová úloha")}</div>`;
  else if(f.mode==="list"){
    body=`<div class="panel">${list.length?table([
      ["",t=>`<button class="check ${isDone(t)?"on":""}" data-done="${esc(t.id)}" aria-label="Hotové"></button>`],
      ["Úloha",t=>`<span class="cut">${esc(t.title||"Bez názvu")}</span>`,"t"],["Stav",t=>chip("tstat",t.status)],["Zodpovedný",t=>who(t.assignee)],
      ["Termín",t=>dueHtml(t.due,isDone(t))],["Priorita",t=>chip("prio",t.priority)],["Projekt",t=>pdot(t.projectId)],["Typ",t=>esc((t.types||[]).join(", "))]
    ],list.sort((a,b)=>(isDone(a)-isDone(b))||byDue(a,b)),t=>"tasks:"+esc(t.id)):`<div class="empty">Žiadne úlohy v tomto filtri.</div>`}</div>`;
  }else{
    body=`<div class="board">${OPT.tstat.map(([st,label,c])=>{
      let col=list.filter(t=>(t.status||"inbox")===st);
      if(st==="hotove")col.sort((a,b)=>(b.doneAt||b.updatedAt||0)-(a.doneAt||a.updatedAt||0));
      else col.sort((a,b)=>(a.priority==="urgentne"?0:1)-(b.priority==="urgentne"?0:1)||byDue(a,b));
      const total=col.length;if(st==="hotove"&&!f.allDone)col=col.slice(0,12);
      return`<div class="col" data-drop="tasks:status:${st}"><h3><span class="row" style="gap:7px;color:var(--ink);font-weight:700"><i class="dot" style="background:${c}"></i>${label}</span><span>${total}</span></h3>
        ${st==="inbox"?`<input type="text" class="qa" id="qa" placeholder="+ Rýchlo pridať a Enter" aria-label="Rýchlo pridať úlohu">`:""}
        ${col.map(taskCard).join("")}
        ${st==="hotove"&&total>12?`<button class="btn ghost sm" id="tf-alldone" style="width:100%;justify-content:center">${f.allDone?"Zobraziť menej":`Zobraziť všetkých ${total}`}</button>`:""}</div>`;
    }).join("")}</div>`;
  }
  return`<div class="head"><div><h1>Úlohy</h1><p class="sub">${S.d.tasks.filter(t=>!isDone(t)).length} otvorených · ťahaním kariet meníte stav</p></div><button class="btn pri" data-create="tasks" data-defs='${esc(JSON.stringify(defs))}'>Nová úloha</button></div>${tools}${body}`;

function taskCard(t){
  const p=get("projects",t.projectId),ev=get("events",t.eventId);const cl=t.checklist||[];
  return`<div class="card" draggable="true" data-drag="tasks:${esc(t.id)}" data-open="tasks:${esc(t.id)}">

    <div class="cm">${p?`<span class="row" style="gap:5px"><i class="dot" style="background:${esc(p.color||GRAY)}"></i>${esc(p.name)}</span>`:""}
      ${ev?`<span>${esc(ev.name)}</span>`:""}${t.priority==="urgentne"&&!isDone(t)?chip("prio","urgentne"):""}
      ${(t.types||[]).map(x=>`<span class="chip out">${esc(x)}</span>`).join("")}
      ${t.assignee?who(t.assignee):""}${t.due?`<span>${dueHtml(t.due,isDone(t))}</span>`:""}
      ${cl.length?`<span>☑ ${cl.filter(x=>x.d).length}/${cl.length}</span>`:""}
      ${S.d.comments.some(c=>c.parent==="tasks:"+t.id)?`<span>💬 ${S.d.comments.filter(c=>c.parent==="tasks:"+t.id).length}</span>`:""}</div></div>`;
}

VIEWS.projekt=()=>{
  const p=get("projects",S.id);if(!p)return`<div class="empty">Projekt sa nenašiel.<br><button class="btn" data-go="projekty">Späť na projekty</button></div>`;
  const c=projCalc(p),pid=esc(p.id),col=p.color||GRAY;
  const G=related("projects",p,"grants"),E=related("projects",p,"events").sort((a,b)=>(b.date||"").localeCompare(a.date||"")),C=related("projects",p,"contacts").sort((a,b)=>(a.name||"").localeCompare(b.name||"","sk"));

  const TABS=[["podujatia","Podujatia",E.length,["events","Nové podujatie"]],["ulohy","Úlohy",c.open,["tasks","Nová úloha"]],["granty","Granty",G.length,["grants","Nový grant"]],["financie","Financie",c.L.length,["ledger","Zapísať platbu"]],["ludia","Ľudia",C.length,["contacts","Nový kontakt"]]];
  const cur=TABS.find(t=>t[0]===tab)||TABS[0];

    :`<div class="spread ptitle" style="align-items:center;flex-wrap:nowrap"><h1>${esc(p.name||"Bez názvu")}</h1><button class="btn" style="flex:none" data-peek="projects:${pid}">Upraviť</button></div>`;
  const bar_=`<div class="ptabs" role="tablist">${TABS.map(([k,l,n])=>`<button role="tab" data-ptab="${k}" aria-selected="${cur[0]===k}">${l}${n?`<span>${n}</span>`:""}</button>`).join("")}${cur[3]?`<span class="ptabs-r"><button class="btn pri sm" data-linknew="projects:${pid}|${cur[3][0]}">${cur[3][1]}</button></span>`:""}</div>`;
  let body="";
  if(cur[0]==="obsah"){
    const row=(l,v)=>`<div class="pl">${l}</div><div class="pv2">${v||'<span class="muted">—</span>'}</div>`;
    body=`<div class="pprops">${row("Miesto",esc(p.place||""))}
      
      ${row("Príjmy / výdavky",c.L.length?`<span class="pos">${eur(c.inc)}</span> / <span class="neg">${eur(c.exp)}</span>`:"")}</div>
      ${p.desc?`<p class="desc" style="margin-top:22px">${esc(p.desc)}</p>`:`<p class="muted" style="margin-top:22px">Popis projektu doplníte cez Upraviť.</p>`}`;
  }
  if(cur[0]==="podujatia"){
    body=`<div class="gal">${E.map(e=>{const u=coverUrl(e);return`<div class="gcard" data-open="events:${esc(e.id)}" tabindex="0" role="link"><div class="gimg" style="background:linear-gradient(160deg,${esc(col)},${esc(col)}cc)">${u?`<img src="${esc(u)}" alt="" loading="lazy" style="object-position:${esc(posOf(e))}">`:""}</div>
      <div class="gbody"><b>${esc(e.name||"Podujatie")}</b>${e.date?`<div class="gl">${fdate(e.date)}${e.time?" "+esc(e.time):""}${e.dateTo&&e.dateTo!==e.date?" → "+fdate(e.dateTo):""}</div>`:""}${e.place?`<div class="gl">${esc(e.place)}</div>`:""}</div></div>`;}).join("")}
      <button class="gnew" data-linknew="projects:${pid}|events">+ Nové podujatie</button></div>${linkSel("projects",p,"events")}`;
  }
  if(cur[0]==="ulohy"){
    body=`<div class="board">${OPT.tstat.map(([st,label,cc])=>{let L=c.T.filter(t=>(t.status||"inbox")===st);const n=L.length;
      L.sort((a,b)=>st==="hotove"?(b.doneAt||b.updatedAt||0)-(a.doneAt||a.updatedAt||0):(a.priority==="urgentne"?0:1)-(b.priority==="urgentne"?0:1)||byDue(a,b));if(st==="hotove")L=L.slice(0,8);
      return`<div class="col" data-drop="tasks:status:${st}"><h3><span class="row" style="gap:7px;color:var(--ink);font-weight:700"><i class="dot" style="background:${cc}"></i>${label}</span><span>${n}</span></h3>${L.map(taskCard).join("")}</div>`;}).join("")}</div>${linkSel("projects",p,"tasks")}`;

        ["Grant",x=>`<span class="meta">${gName(get("grants",x.grantId))}</span>`],["Doklad",x=>`<span class="meta">${esc(x.docNo||"")}</span>`],["Suma",x=>`<span class="${x.type==="prijem"?"pos":""}">${x.type==="prijem"?"+":"−"}${eur(x.amount)}</span>`,"num"]],L,x=>"ledger:"+esc(x.id))
        :`<div class="empty">Zatiaľ žiadne platby.</div>`}</div>`;
  }
  if(cur[0]==="ludia"){
    body=`<div class="gal">${C.map(x=>`<div class="gcard" data-open="contacts:${esc(x.id)}" tabindex="0" role="link"><div class="gbody" style="padding-top:14px"><div class="spread" style="flex-wrap:nowrap;align-items:flex-start"><b>${esc(x.name||"Bez mena")}</b>${chip("crole",x.role)}</div>

  }
  return`${head}${bar_}${body}`;
};
function linkSel(e,r,t){
  const ids=new Set(related(e,r,t).map(x=>x.id));
  const avail=S.d[t].filter(x=>!ids.has(x.id)&&(t!=="grants"||x.status==="schvalene")).sort((a,b)=>ttl(t,a).localeCompare(ttl(t,b),"sk"));
  return avail.length?`<select class="linksel" data-linkadd="${e}:${esc(r.id)}|${t}" aria-label="Prepojiť existujúce"><option value="">↗ Prepojiť existujúce…</option>${avail.map(x=>`<option value="${esc(x.id)}">${esc(ttl(t,x))}${t==="grants"&&provName(x)?" — "+esc(provName(x)):""}</option>`).join("")}</select>`:"";
}

/* ----- Granty ----- */
const GCOLS=[["Príprava",["napad","priprava","pozastavene"]],["Podané",["podane"]],["Schválené",["schvalene"]],["Zrealizované",["zrealizovane"]],["Uzavreté",["vyuctovane","nepodporene"]]];
function nextGrantDate(g){
  const c=[["Uzávierka",g.submitTo,["napad","priprava"]],["Koniec realizácie",g.realTo,["schvalene"]],["Vyúčtovanie",g.settleDue,["schvalene","zrealizovane"]]];
  for(const[l,d,st]of c)if(d&&st.includes(g.status))return[l,d];return null;
}
const GTABS=[["planovane","Plánované",["napad","priprava","pozastavene"]],["prebieha","Prebieha",["podane","schvalene"]],["zrealizovane","Zrealizované",["zrealizovane","vyuctovane"]],["nepodporene","Nepodporené",["nepodporene"]]];
const GRADS=["linear-gradient(180deg,#8fd0d2,#e0726a)","linear-gradient(135deg,#2f5fa8 10%,#c2412f)","#efc06a","#df605a","linear-gradient(135deg,#5a4fd8,#e06a8c)","linear-gradient(165deg,#a8c3a6,#e2562f)","linear-gradient(135deg,#c7a7d8,#f1d9c9 60%,#8fc2c4)"];
function gradFor(id){let h=0;for(const ch of String(id))h=(h*31+ch.charCodeAt(0))>>>0;return GRADS[h%GRADS.length];}
function grantCard(g){

function loadPdfJs(){if(_pdfjs)return _pdfjs;_pdfjs=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";

async function viewDoc(href,name){
  const host=document.createElement("div");host.className="docview";host.setAttribute("role","dialog");host.setAttribute("aria-label",name||"Dokument");
  host.innerHTML=`<div class="dvh"><b></b><button class="btn sm" data-dvdl hidden>Stiahnuť</button><button class="btn sm" data-dvclose>Zavrieť</button></div><div class="dvb"><div class="dvmsg">Načítavam…</div></div>`;
  host.querySelector("b").textContent=name||"Dokument";document.body.appendChild(host);
  const close=()=>{host.remove();document.removeEventListener("keydown",esc,true);};const esc=e=>{if(e.key==="Escape"){e.stopPropagation();close();}};document.addEventListener("keydown",esc,true);
  host.querySelector("[data-dvclose]").onclick=close;host.addEventListener("click",e=>{if(e.target===host||e.target.classList.contains("dvb"))close();});
  const body=host.querySelector(".dvb");
  let blob;try{const r=await fetch(href);if(!r.ok)throw new Error(r.status);blob=await r.blob();}catch(e){body.innerHTML=`<div class="dvmsg">Súbor sa nepodarilo načítať.</div>`;return;}
  if(dl){const b=host.querySelector("[data-dvdl]");b.hidden=false;b.onclick=async()=>{try{await dl.save({filename:(name||"dokument").replace(/[\\/:*?"<>|]+/g,"_")+(/\.[a-z0-9]{2,4}$/i.test(name||"")?"":(blob.type==="application/pdf"?".pdf":"")),data:blob});}catch(e){if(e&&e.code!=="declined")toast("Stiahnutie sa nepodarilo.");}};}
  const type=blob.type||"";
  if(type.startsWith("image/")){const u=URL.createObjectURL(blob);body.innerHTML="";const im=new Image();im.src=u;im.alt=name||"";body.appendChild(im);return;}
  if(type==="application/pdf"||/\.pdf$/i.test(name||"")){
    try{const lib=await loadPdfJs();const pdf=await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;body.innerHTML="";
      const w=Math.min(900,body.clientWidth-40);
      for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const v1=pg.getViewport({scale:1});const sc=(w/v1.width)*(window.devicePixelRatio||1);const vp=pg.getViewport({scale:sc});
        const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;c.style.width=w+"px";body.appendChild(c);await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;}
    }catch(e){console.warn("[pdf]",e);body.innerHTML=`<div class="dvmsg">PDF sa nedá zobraziť priamo tu. ${dl?"Použi Stiahnuť.":""}</div>`;}
    return;}
  body.innerHTML=`<div class="dvmsg">Tento typ súboru sa nedá zobraziť priamo tu.${dl?" Použi Stiahnuť.":""}</div>`;
}

(function(){let D=null;
  const rowOf=el=>el&&el.closest&&el.closest("tr");
  const clear=()=>document.querySelectorAll(".rdrop-t,.rdrop-b,.rdrag").forEach(x=>x.classList.remove("rdrop-t","rdrop-b","rdrag"));
  const target=(x,y)=>{const el=document.elementFromPoint(x,y);const tr=rowOf(el);return tr&&tr!==D.tr&&tr.parentNode===D.tr.parentNode&&tr.querySelector("[data-rowdrag]")?tr:null;};
  document.addEventListener("click",e=>{if(e.target.closest&&e.target.closest("[data-rowdrag]")){e.stopPropagation();e.preventDefault();}},true);
  document.addEventListener("pointerdown",e=>{const h=e.target.closest&&e.target.closest("[data-rowdrag]");if(!h||e.button>0)return;e.preventDefault();
    D={h,tr:rowOf(h),y:e.clientY,on:false};
    const mv=ev=>{if(!D)return;if(!D.on){if(Math.abs(ev.clientY-D.y)<4)return;D.on=true;D.tr.classList.add("rdrag");document.body.style.userSelect="none";}
      ev.preventDefault();document.querySelectorAll(".rdrop-t,.rdrop-b").forEach(x=>x.classList.remove("rdrop-t","rdrop-b"));
      const t=target(ev.clientX,ev.clientY);if(t){const r=t.getBoundingClientRect();t.classList.add(ev.clientY>r.top+r.height/2?"rdrop-b":"rdrop-t");}};
    const up=async ev=>{window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);document.body.style.userSelect="";
      const d=D;D=null;if(!d||!d.on){clear();return;}const t=(()=>{D=d;const r=target(ev.clientX,ev.clientY);D=null;return r;})();
      if(!t){clear();return;}const after=ev.clientY>t.getBoundingClientRect().top+t.getBoundingClientRect().height/2;
      const ids=[...d.tr.parentNode.querySelectorAll("[data-rowdrag]")].map(x=>x.dataset.rowdrag);const mid=d.h.dataset.rowdrag,tid=t.querySelector("[data-rowdrag]").dataset.rowdrag;
      const order=ids.filter(x=>x!==mid);let i=order.indexOf(tid);if(after)i++;order.splice(i,0,mid);clear();
      await reorderLedger(order,mid);};
    window.addEventListener("pointermove",mv,{passive:false});window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);});
})();
async function reorderLedger(order,moved){
  const recs=order.map(id=>get("ledger",id)).filter(Boolean);
  const ok=recs.every((r,i)=>typeof r.ord==="number"&&(i===0||recs[i-1].ord<r.ord));
  const allHave=recs.every(r=>typeof r.ord==="number");
  if(allHave&&!ok){const i=order.indexOf(moved);const prev=recs[i-1],next=recs[i+1];
    let o=prev&&next?(prev.ord+next.ord)/2:prev?prev.ord+1000:next?next.ord-1000:0;
    if(prev&&next&&!(next.ord-prev.ord>1e-6)){o=null;}
    if(o!==null){await upd("ledger",moved,{ord:o});return;}}
  if(ok)return;
  toast("Ukladám poradie…");for(let i=0;i<recs.length;i++){const want=(i+1)*1000;if(recs[i].ord!==want)await upd("ledger",recs[i].id,{ord:want});}toast("Poradie uložené.");
}

function openSearch(){
  const L=$("#layer");L.innerHTML=`<div class="scrim" id="pal-scrim"><div class="modal pal" role="dialog" aria-modal="true" aria-label="Hľadať"><input type="search" id="pal-q" placeholder="Hľadať úlohy, projekty, granty, podujatia, kontakty, platby…" autocomplete="off"><div class="res" id="pal-res"></div></div></div>`;
  const inp=$("#pal-q"),res=$("#pal-res");let hits=[],hl=0;
  const drawRes=()=>{const q=inp.value.trim().toLowerCase();hits=[];
    if(q){for(const k of ["projects","grants","events","tasks","contacts","ledger","lines"]){S.d[k].forEach(r=>{const t=ttl(k,r);const hay=(t+" "+(r.org||"")+" "+(k==="grants"?provName(r):"")+" "+(r.docNo||"")+" "+(r.email||"")).toLowerCase();if(hay.includes(q))hits.push({k,r,t,i:t.toLowerCase().indexOf(q)});});}
      hits.sort((a,b)=>(a.i<0?99:a.i)-(b.i<0?99:b.i));hits=hits.slice(0,30);}
    else hits=[...KEYS.filter(k=>k!=="comments"&&k!=="partnerships"&&k!=="zab").flatMap(k=>S.d[k].map(r=>({k,r,t:ttl(k,r),u:r.updatedAt||0})))].sort((a,b)=>b.u-a.u).slice(0,8);
    hl=Math.min(hl,Math.max(hits.length-1,0));
    res.innerHTML=hits.length?(q?"":'<div class="meta" style="padding:6px 12px">Naposledy upravené</div>')+hits.map((h,i)=>`<button class="${i===hl?"hl":""}" data-i="${i}">${h.k==="projects"?`<i class="dot" style="background:${esc(h.r.color||GRAY)}"></i>`:""}<span>${esc(h.t)}</span><span class="k">${esc(ENT[h.k].one)}</span></button>`).join(""):`<div class="empty" style="padding:12px 14px">Nič sa nenašlo.</div>`;
    res.querySelectorAll("button").forEach(b=>b.onclick=()=>pick(+b.dataset.i));};
  const pick=i=>{const h=hits[i];if(!h)return;L.innerHTML="";openRec(h.k,h.r.id);};
  inp.oninput=()=>{hl=0;drawRes();};
  inp.onkeydown=e=>{if(e.key==="ArrowDown"){e.preventDefault();hl=Math.min(hl+1,hits.length-1);drawRes();}else if(e.key==="ArrowUp"){e.preventDefault();hl=Math.max(hl-1,0);drawRes();}else if(e.key==="Enter"){e.preventDefault();pick(hl);}};
  $("#pal-scrim").addEventListener("mousedown",e=>{if(e.target.id==="pal-scrim")L.innerHTML="";});
  drawRes();inp.focus();
}

async function exportCsv(kind,id){
  if(!dl)return;const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;const n=v=>(Math.round((+v||0)*100)/100).toFixed(2).replace(".",",");
  const lc=ledgerCalc();let rows,name;
  if(kind==="grant"){
    const g=get("grants",id);if(!g)return;const c=grantCalc(g);
    rows=[[ORG.name+", IČO "+ORG.ico],["Podklad k vyúčtovaniu: "+(g.name||"")],["Poskytovateľ: "+provName(g)+(g.contractNo?", zmluva č. "+g.contractNo:"")],["Schválená suma: "+n(g.approved)+" €"],[],
      ["Rozpočtová položka","P. č.","Dátum","Doklad č.","Popis","Dodávateľ","Z dotácie","Spolufinancovanie","Vyplatené"]];
    const Ln=S.d.lines.filter(l=>l.grantId===g.id);
    const groups=[...Ln.map(l=>({name:l.name||"Položka",L:c.L.filter(x=>x.lineId===l.id&&x.type!=="prijem"),l})),{name:"Bez priradenej položky",L:c.L.filter(x=>!x.lineId&&x.type!=="prijem")}];
    groups.forEach(gr=>{if(!gr.L.length&&!gr.l)return;gr.L.sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(x=>rows.push([gr.name,(lc.map[x.id]||{}).seq,fdate(x.date),x.docNo,x.desc,ttl("contacts",get("contacts",x.contactId)),x.cofin?"":n(x.amount),x.cofin?n(x.amount):"",x.paid===false?"nie":"áno"]));
      rows.push([gr.name+" – spolu","","","","","",n(sum(gr.L.filter(x=>!x.cofin),x=>x.amount)),n(sum(gr.L.filter(x=>x.cofin),x=>x.amount)),gr.l&&gr.l.fromGrant?"rozpočet z dotácie "+n(gr.l.fromGrant):""]);});
    rows.push([],["SPOLU","","","","","",n(c.sg),n(c.sc),""]);
    name=`vyuctovanie-${(g.name||"grant").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").slice(0,40)}.csv`;
  }else{
    const list=[...ledgerFiltered()].sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.createdAt||0)-(b.createdAt||0));
    rows=[["P. č.","Dátum","Typ","Účet","Popis","Komu / od koho","Doklad č.","Projekt","Grant","Rozpočtová položka","Kategória","Príjem","Výdavok","Zost. banka","Zost. pokladňa","Vyplatené","Spolufinancovanie"]];
    list.forEach(x=>{const m=lc.map[x.id]||{};rows.push([m.seq,fdate(x.date),optL("ltype",x.type),optL("acct",x.account||"banka"),x.desc,ttl("contacts",get("contacts",x.contactId)),x.docNo,ttl("projects",get("projects",x.projectId)),ttl("grants",get("grants",x.grantId)),ttl("lines",get("lines",x.lineId)),x.category,x.type==="prijem"?n(x.amount):"",x.type!=="prijem"?n(x.amount):"",n(m.bank),n(m.cash),x.paid===false?"nie":"áno",x.cofin?"áno":""]);});
    name=`penazny-dennik-${S.ff.year||"vsetko"}-${today()}.csv`;
  }
  const csv="\ufeff"+rows.map(r=>r.map(q).join(";")).join("\r\n");
  try{await dl.save({filename:name,data:csv});}catch(e){if(e&&e.code!=="declined")toast("Export sa nepodaril.");}
}

/* drag a row by its handle (mouse, touch) or move it with arrow keys; sel = attribute prefix shared by the handles of one list */
function zbDrag(h,from,sel,moveTo){
  h.onkeydown=e=>{if(e.key!=="ArrowUp"&&e.key!=="ArrowDown")return;e.preventDefault();const d=e.key==="ArrowUp"?from-1:from+1;if(d<0)return;moveTo(d);
    setTimeout(()=>{const nh=document.querySelector(`${sel}${d}"]`);if(nh)nh.focus();},80);};
  h.onpointerdown=e=>{
    if(e.button>0)return;e.preventDefault();
    const row=h.closest("[data-zbrow],[data-zbsrow]"),box=row.parentElement,rows=[...box.children].filter(r=>r.dataset&&(r.dataset.zbrow!==undefined||r.dataset.zbsrow!==undefined));
    const main=$("#main");let to=from,moved=false,sy=e.clientY,timer=null,lastY=e.clientY;
    try{h.setPointerCapture(e.pointerId);}catch(_){}
    const clear=()=>rows.forEach(r=>r.classList.remove("dropa","dropb"));
    const place=y=>{clear();let t=rows.length;for(let j=0;j<rows.length;j++){const b=rows[j].getBoundingClientRect();if(y<b.top+b.height/2){t=j;break;}}
      to=t;if(t<rows.length)rows[t].classList.add("dropb");else rows[rows.length-1].classList.add("dropa");};
    const scroll=()=>{if(!main)return;const r=main.getBoundingClientRect();const d=lastY<r.top+70?-14:lastY>r.bottom-70?14:0;if(d){main.scrollTop+=d;place(lastY);}};
    const move=ev=>{lastY=ev.clientY;if(!moved){if(Math.abs(ev.clientY-sy)<4)return;moved=true;row.classList.add("dragging");document.body.classList.add("zb-dragging");timer=setInterval(scroll,30);}place(ev.clientY);};
    const end=()=>{h.removeEventListener("pointermove",move);h.removeEventListener("pointerup",end);h.removeEventListener("pointercancel",end);clearInterval(timer);
      clear();row.classList.remove("dragging");document.body.classList.remove("zb-dragging");if(!moved)return;const d=to>from?to-1:to;if(d!==from)moveTo(d);};
    h.addEventListener("pointermove",move);h.addEventListener("pointerup",end);h.addEventListener("pointercancel",end);
  };
}

  if(S.view!=="zabezpecenie")return;
  v.querySelectorAll("[data-zbsum]").forEach(d=>d.addEventListener("toggle",()=>{S.zb.sums[d.dataset.zbsum]=d.open;}));
  v.querySelectorAll("[data-zbf]").forEach(b=>b.onclick=()=>{S.zb.f=b.dataset.zbf;render();});
  v.querySelectorAll("[data-zbmode]").forEach(b=>b.onclick=()=>{S.zb.mode=b.dataset.zbmode;render();});
  v.querySelectorAll("[data-zbjump]").forEach(a=>a.onclick=e=>{e.preventDefault();S.zb.f="all";S.zb.mode="diela";render();const el=document.getElementById("zb-"+a.dataset.zbjump);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});});
  v.querySelectorAll("[data-zb]").forEach(el=>{
    const commit=()=>{
      const[id,k,i,fld]=el.dataset.zb.split("|");
      const val=el.type==="checkbox"?el.checked:el.value;
      zbSave(id,x=>{
        if(i===undefined)return(x[k]??"")===val?null:{[k]:val};
        const arr=(x[k]||[]).map(r=>Object.assign({},r));if(!arr[+i]||arr[+i][fld]===val)return null;
        arr[+i][fld]=val;return{[k]:arr};});
    };
    if(el.type==="checkbox"||el.tagName==="SELECT")el.onchange=commit;
    else{el.onchange=commit;el.onblur=commit;el.onkeydown=e=>{if(e.key==="Enter"&&el.tagName!=="TEXTAREA")el.blur();};}
  });
  v.querySelectorAll("[data-zbadd]").forEach(b=>b.onclick=()=>{
    const[id,k]=b.dataset.zbadd.split("|");let n=0;
    const row=k==="technika"?{nazov:"",ks:"",zdroj:"",ok:false}:k==="personal"?{rola:"",kto:"",den:"2026-10-30",od:"17:00",do:"22:00",kedy:"",ok:false}:{text:"",hotovo:false};
    zbSave(id,x=>{const arr=[...(x[k]||[]),row];n=arr.length-1;const p={[k]:arr};if((x.stav||"navrh")==="navrh")p.stav="rozpracovane";return p;})
      .then(()=>{const pf={technika:"t",personal:"p",ulohy:"u"}[k],sf={technika:"n",personal:"r",ulohy:"t"}[k];const el=document.getElementById(`zb-${id}-${pf}${n}-${sf}`);if(el)el.focus();});
  });
  v.querySelectorAll("[data-zbdel]").forEach(b=>b.onclick=()=>{
    const[id,k,i]=b.dataset.zbdel.split("|");
    zbSave(id,x=>({[k]:(x[k]||[]).filter((_,j)=>j!==+i)}));
  });
  v.querySelectorAll("[data-zbdrag]").forEach(h=>{
    const[id,k,fi]=h.dataset.zbdrag.split("|");const from=+fi;
    zbDrag(h,from,`[data-zbdrag="${id}|${k}|`,dest=>{Object.keys(S.zb.open).forEach(q=>{if(q.startsWith(id+"-"))delete S.zb.open[q];});
      zbSave(id,x=>{const a=[...(x[k]||[])];if(dest>=a.length)dest=a.length-1;if(dest===from)return null;const[m]=a.splice(from,1);a.splice(dest,0,m);return{[k]:a};});});
  });
  v.querySelectorAll("[data-zbsdrag]").forEach(h=>{
    const[kind,fi]=h.dataset.zbsdrag.split("|");const from=+fi;
    zbDrag(h,from,`[data-zbsdrag="${kind}|`,dest=>{
      const keys=[...h.closest("table").querySelectorAll("tr[data-zbsrow]")].map(r=>r.dataset.key);
      if(dest>=keys.length)dest=keys.length-1;if(dest===from)return;const[m]=keys.splice(from,1);keys.splice(dest,0,m);
      saveSettings({zbOrder:Object.assign({},S.settings.zbOrder||{},{[kind]:keys})});});
  });
  v.querySelectorAll("[data-zbsname]").forEach(el=>{
    const commit=()=>{
      const p=el.dataset.zbsname.split("|"),nv=el.value.trim().replace(/\s+/g," ");
      if(p[0]==="ul"){zbSave(p[1],y=>{const a=(y.ulohy||[]).map(r=>Object.assign({},r));const r=a[+p[2]];if(!r||!nv||r.text===nv)return null;r.text=nv;return{ulohy:a};});return;}
      const oldK=p[1],newK=zbKey(nv),arr=p[0]==="tech"?"technika":"personal",fld=p[0]==="tech"?"nazov":"kto",kind=p[0];
      if(!nv){el.value=el.defaultValue;return;}
      if(el.value!==el.defaultValue||newK!==oldK){
        const exists=newK!==oldK&&S.d.zab.some(x=>(x[arr]||[]).some(r=>zbKey(r[fld])===newK));
        const hit=r=>{const k=zbKey(r[fld]);return k===oldK||k===newK;};
        S.d.zab.forEach(x=>{if((x[arr]||[]).some(r=>hit(r)&&r[fld]!==nv))
          zbSave(x.id,y=>({[arr]:(y[arr]||[]).map(r=>hit(r)?Object.assign({},r,{[fld]:nv}):r)}));});
        const o=((S.settings.zbOrder||{})[kind])||[];
        if(newK!==oldK&&o.includes(oldK))saveSettings({zbOrder:Object.assign({},S.settings.zbOrder,{[kind]:exists?o.filter(k=>k!==oldK):o.map(k=>k===oldK?newK:k)})});
        if(exists)toast(`Zlúčené s „${nv}“.`);
      }
    };
    el.onchange=commit;el.onkeydown=e=>{if(e.key==="Enter")el.blur();if(e.key==="Escape"){el.value=el.defaultValue;el.blur();}};
  });
  v.querySelectorAll("[data-zbsok]").forEach(c=>{
    if(c.dataset.ind)c.indeterminate=true;
    c.onchange=()=>{const val=c.checked,p=c.dataset.zbsok.split("|");
      if(p[0]==="tech"){S.d.zab.forEach(x=>{if((x.technika||[]).some(r=>zbKey(r.nazov)===p[1]&&!!r.ok!==val))
        zbSave(x.id,y=>({technika:(y.technika||[]).map(r=>zbKey(r.nazov)===p[1]?Object.assign({},r,{ok:val}):r)}));});}
      else{const fld=p[0]==="ul"?["ulohy","hotovo"]:["personal","ok"];
        zbSave(p[1],y=>{const a=(y[fld[0]]||[]).map(r=>Object.assign({},r));if(!a[+p[2]])return null;a[+p[2]][fld[1]]=val;return{[fld[0]]:a};});}
    };
  });
  v.querySelectorAll("[data-zbwhen]").forEach(b=>b.onclick=()=>{const key=b.dataset.zbwhen.replace("|","-");S.zb.open[key]=!S.zb.open[key];render();
    if(S.zb.open[key]){const[id,i]=b.dataset.zbwhen.split("|");const el=document.getElementById(`zb-${id}-p${i}-d`);if(el)el.focus();}});
  v.querySelectorAll("[data-zbrm]").forEach(b=>b.onclick=()=>{const x=get("zab",b.dataset.zbrm);ask(`Odstrániť dielo „${(x&&x.title)||"bez názvu"}“ aj s celým plánom?`,"Odstrániť").then(ok=>{if(ok)del("zab",b.dataset.zbrm);});});
  v.querySelectorAll("[data-zbnew]").forEach(b=>b.onclick=async()=>{
    const ord=Math.max(0,...S.d.zab.map(x=>+x.ord||0))+1;S.zb.f="all";
    const id=await add("zab",{ord,title:"",author:"",stav:"navrh",napajanie:"",technika:[],personal:[],ulohy:[],poznamka:""});
    if(id)setTimeout(()=>{const el=document.getElementById(`zb-${id}-title`);if(el){el.scrollIntoView({block:"center"});el.focus();}},50);
  });
}

function bindView(){
  const v=$("#view");zbBind(v);const on=(sel,ev,fn)=>{const el=v.querySelector(sel);if(el)el.addEventListener(ev,fn);};
  v.querySelectorAll("[data-etab]").forEach(b=>b.onclick=()=>{S.ef.tab=b.dataset.etab;render();});
  v.querySelectorAll("[data-emode]").forEach(b=>b.onclick=()=>{S.ef.mode=b.dataset.emode;render();});
  v.querySelectorAll("[data-gtab]").forEach(b=>b.onclick=()=>{S.gf.tab=b.dataset.gtab;render();});
  v.querySelectorAll("[data-ptab]").forEach(b=>b.onclick=()=>{S.ptab=b.dataset.ptab;render();});
  v.querySelectorAll("[data-pm]").forEach(b=>b.onclick=()=>{S.pm=b.dataset.pm;render();});
  v.querySelectorAll(".gcard").forEach(c=>c.onkeydown=ev=>{if(ev.key==="Enter")c.click();});
  v.querySelectorAll("[data-pf]").forEach(b=>b.onclick=()=>{S.pf=b.dataset.pf;render();});
  v.querySelectorAll("[data-tmode]").forEach(b=>b.onclick=()=>{S.tf.mode=b.dataset.tmode;render();});
  v.querySelectorAll("[data-gmode]").forEach(b=>b.onclick=()=>{S.gf.mode=b.dataset.gmode;render();});
  v.querySelectorAll("[data-grtab]").forEach(b=>b.onclick=()=>{S.grtab=b.dataset.grtab;render();});
  on("#g-text","change",e=>upd("grants",S.id,{text:e.target.value}));
  v.querySelectorAll("[data-evtab]").forEach(b=>b.onclick=()=>{S.evtab=b.dataset.evtab;render();});
  {const ev=S.view==="podujatie"&&get("events",S.id);if(ev){
    const setEv=d=>upd("events",ev.id,d);
    v.querySelectorAll("[data-evbmode]").forEach(x=>x.onclick=()=>{S.evb.mode=x.dataset.evbmode;render();});v.querySelectorAll("[data-unl]").forEach(x=>x.onclick=()=>{S.evb.unl=!S.evb.unl;render();});
    v.querySelectorAll("[data-evb]").forEach(x=>x.onclick=()=>{if(x._moved){x._moved=false;return;}const k=x.dataset.evb,now=Date.now(),lc=S._evbClick;S._evbClick={k,t:now};
      if(k&&k!=="__none"&&lc&&lc.k===k&&now-lc.t<450){S._evbClick=null;const b2=v.querySelector(`[data-evbdrag="${CSS.escape(k)}"]`);if(b2)evbEdit(b2,ev,k);return;}
      if(S.evb.mode==="sekcie")S.evb.sec=k;else S.evb.gr=k;render();});
    {const keys=()=>[...v.querySelectorAll("[data-evbdrag]")].map(x=>x.dataset.evbdrag);let D=null;
    const clear=()=>v.querySelectorAll(".dropl,.dropr,.dragging").forEach(y=>y.classList.remove("dropl","dropr","dragging"));
    const target=(x,y,ex)=>{const el=document.elementFromPoint(x,y);const t=el&&el.closest&&el.closest("[data-evbdrag]");return t&&t!==ex?t:null;};
    const start=()=>{D.on=true;D.el.classList.add("dragging");document.body.style.userSelect="none";};
    const move=ev2=>{if(!D)return;const dx=ev2.clientX-D.x,dy=ev2.clientY-D.y;
      if(!D.on){if(D.touch){if(Math.abs(dx)>8||Math.abs(dy)>8){clearTimeout(D.tm);D=null;}return;}if(Math.abs(dx)>6)start();else return;}
      ev2.preventDefault();v.querySelectorAll(".dropl,.dropr").forEach(y=>y.classList.remove("dropl","dropr"));
      const t=target(ev2.clientX,ev2.clientY,D.el);if(t){const r=t.getBoundingClientRect();t.classList.add(ev2.clientX>r.left+r.width/2?"dropr":"dropl");}};
    const up=ev2=>{if(!D)return;clearTimeout(D.tm);const d=D;D=null;document.body.style.userSelect="";
      window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);window.removeEventListener("touchmove",tmove);
      if(!d.on){return;}d.el._moved=true;const t=target(ev2.clientX,ev2.clientY,d.el);clear();if(!t)return;
      const r=t.getBoundingClientRect(),after=ev2.clientX>r.left+r.width/2;const k=d.el.dataset.evbdrag;
      const a=keys().filter(x=>x!==k);let i=a.indexOf(t.dataset.evbdrag);if(after)i++;a.splice(i,0,k);
      setEv(S.evb.mode==="sekcie"?{sections:a}:{provOrder:a});};
    const tmove=ev2=>{if(D&&D.on)ev2.preventDefault();};
    v.querySelectorAll("[data-evbdrag]").forEach(x=>x.addEventListener("pointerdown",ev2=>{if(ev2.button>0)return;
      D={el:x,x:ev2.clientX,y:ev2.clientY,on:false,touch:ev2.pointerType==="touch"};
      if(D.touch)D.tm=setTimeout(()=>{if(D&&!D.on){start();if(navigator.vibrate)try{navigator.vibrate(15);}catch(_){}}},350);
      window.addEventListener("pointermove",move,{passive:false});window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);window.addEventListener("touchmove",tmove,{passive:false});}));}
    on("#evb-newsec","keydown",e=>{if(e.key!=="Enter")return;const t=e.target.value.trim();if(!t)return;const a=[...(ev.sections||[])];if(!a.includes(t))a.push(t);S.evb.sec=t;if(!baseCats().includes(t))saveSettings({cats:[...baseCats(),t]});setEv({sections:a});});
    on("#ev-dram","change",e=>setEv({dramaturgy:e.target.value}));
    on("#ev-mkt","change",e=>setEv({marketing:e.target.value}));
    on("#ev-prog-add","click",()=>setEv({program:[...(ev.program||[]),{time:"",title:"",contactId:"",place:""}]}));
    v.querySelectorAll("[data-prog]").forEach(inp=>inp.onchange=()=>{const[i,k]=inp.dataset.prog.split(":");const a=(ev.program||[]).map(x=>({...x}));if(!a[+i])return;a[+i][k]=inp.value;setEv({program:a});});
    v.querySelectorAll("[data-progdel]").forEach(x=>x.onclick=()=>{const a=(ev.program||[]).filter((_,i)=>i!==+x.dataset.progdel);setEv({program:a});});
    v.querySelectorAll("[data-mk]").forEach(x=>x.onclick=ev2=>{ev2.stopPropagation();const a=evMkt(ev).map(y=>({...y}));a[+x.dataset.mk].d=!a[+x.dataset.mk].d;setEv({mkt:a});});
    v.querySelectorAll("[data-mkdel]").forEach(x=>x.onclick=()=>{setEv({mkt:evMkt(ev).filter((_,i)=>i!==+x.dataset.mkdel)});});
    on("#ev-mk-add","keydown",e=>{if(e.key!=="Enter"||!e.target.value.trim())return;const a=evMkt(ev).map(y=>({...y}));a.push({t:e.target.value.trim(),d:false});e.target.value="";setEv({mkt:a});});
    v.querySelectorAll("[data-docdel]").forEach(x=>x.onclick=async()=>{if(await ask("Odstrániť dokument zo zoznamu?","Odstrániť"))setEv({docs:(ev.docs||[]).filter((_,i)=>i!==+x.dataset.docdel)});});
    on("#ev-doc-link","click",()=>{const f=$("#ev-doc-form");f.hidden=!f.hidden;if(!f.hidden)$("#ev-doc-name").focus();});
    on("#ev-doc-save","click",()=>{const n=$("#ev-doc-name").value.trim(),u=$("#ev-doc-url").value.trim();if(!u){toast("Vložte odkaz.");return;}setEv({docs:[...(ev.docs||[]),{name:n||u,url:u,at:Date.now()}]});});
    on("#ev-doc-file","change",async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const d=await uploadDoc(f,{en:"events",id:ev.id,kind:""});e.target.value="";if(d)await setEv({docs:[...(ev.docs||[]),Object.assign(d,{at:Date.now()})]});});
  }}
  v.querySelectorAll("[data-fyear]").forEach(b=>b.onclick=()=>{S.ff.year=b.dataset.fyear;render();});v.querySelectorAll("[data-fftoggle]").forEach(b=>b.onclick=()=>{S.ffOpen=!S.ffOpen;render();});v.querySelectorAll("[data-ffclear]").forEach(b=>b.onclick=()=>{Object.assign(S.ff,{acct:"",type:"",project:"",grant:""});render();});
  v.querySelectorAll("[data-ftab]").forEach(b=>b.onclick=()=>{S.ff.tab=b.dataset.ftab;render();});
  ["project","who","type","org"].forEach(k=>on("#tf-"+k,"change",e=>{S.tf[k]=e.target.value;render();}));
  on("#tf-q","input",e=>{S.tf.q=e.target.value;render();});
  on("#tf-alldone","click",()=>{S.tf.allDone=!S.tf.allDone;render();});
  on("#qa","keydown",async e=>{if(e.key!=="Enter"||!e.target.value.trim())return;const t=e.target.value.trim();e.target.value="";
    const d={title:t,status:"inbox",priority:"normalne",org:"ars"};if(S.tf.project)d.projectId=S.tf.project;if(S.tf.who==="__me"&&meId())d.assignee=meId();await add("tasks",d);});
  ["year","acct","type","project","grant"].forEach(k=>on("#ff-"+k,"change",e=>{S.ff[k]=e.target.value;render();}));
  on("#ff-q","input",e=>{S.ff.q=e.target.value;render();});
  on("#cf-q","input",e=>{S.cf.q=e.target.value;render();});
  v.querySelectorAll("[data-ctab]").forEach(b=>b.onclick=()=>{S.cf.tab=b.dataset.ctab;render();});
  on("#cf-state","change",e=>{S.cf.state=e.target.value;render();});
  on("#cf-ev","change",e=>{S.cf.ev=e.target.value;render();});
  on("#cf-copy","click",async()=>{const m=(S._clist||[]).filter(c=>c.email).map(c=>c.email).join(", ");try{await navigator.clipboard.writeText(m);toast("E-maily skopírované.");}catch(_){toast("Kopírovanie nie je dostupné.");}});
  on("#ef-past","click",()=>{S.ef.past=!S.ef.past;render();});
  on("#pj-ledger","click",e=>{S.ff=Object.assign(S.ff,{tab:"dennik",project:e.target.dataset.pid,grant:"",year:String(new Date().getFullYear()),acct:"",type:"",q:""});go("financie");});
  on("#cal-prev","click",()=>{S.cal.m--;if(S.cal.m<0){S.cal.m=11;S.cal.y--;}render();});
  on("#cal-next","click",()=>{S.cal.m++;if(S.cal.m>11){S.cal.m=0;S.cal.y++;}render();});
  on("#cal-now","click",()=>{const n=new Date();S.cal={y:n.getFullYear(),m:n.getMonth()};render();});
  on("#g-ck-add","keydown",e=>{if(e.key!=="Enter"||!e.target.value.trim())return;const g=get("grants",S.id);const a=(g.checklist||[]).map(x=>({...x}));a.push({t:e.target.value.trim(),d:false});e.target.value="";upd("grants",g.id,{checklist:a});});
  on("#st-bank","change",e=>saveSettings({openBank:e.target.value===""?null:+e.target.value}));
  on("#st-cash","change",e=>saveSettings({openCash:e.target.value===""?null:+e.target.value}));
  on("#st-cats","change",e=>saveSettings({cats:e.target.value.split("\n").map(s=>s.trim()).filter(Boolean)}));
  on("#st-types","change",e=>saveSettings({ttypes:e.target.value.split("\n").map(s=>s.trim()).filter(Boolean)}));
  bindDnD(v);
}
$("#sidescrim").onclick=closeSide;
document.addEventListener("keydown",e=>{if(e.altKey&&e.key==="ArrowLeft"){e.preventDefault();goBack();}});
boot();

})();
